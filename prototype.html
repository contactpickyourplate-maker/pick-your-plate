  <!-- plate-shapes.jsx -->
  <script type="text/babel">
const PLATE_TYPES = [
  { id: 'basic',         label: 'Basic',       caption: 'Round plate'        },
  { id: 'divided',       label: 'Divided',     caption: 'Three sections'     },
  { id: 'rainbow',       label: 'Rainbow',     caption: 'Color by color'     },
  { id: 'one-new-thing', label: '1 New Thing', caption: 'Spotlight one food' },
  { id: 'snack',         label: 'Snack',       caption: 'Smaller tray'       },
];

function PlateShape({ type = 'basic', plateColor = '#ffffff', rimColor = '#e4e4e4', rimInset = 18 }) {
  if (type === 'divided') {
    return (
      <svg viewBox="0 0 100 100" style={{ position: 'absolute', inset: rimInset, pointerEvents: 'none' }}>
        <defs><clipPath id="pp-clip-div"><circle cx="50" cy="50" r="50" /></clipPath></defs>
        <g clipPath="url(#pp-clip-div)" stroke="#b0b0b0" strokeWidth="1.5" strokeLinecap="round">
          <line x1="50" y1="50" x2="50" y2="0" />
          <line x1="50" y1="50" x2="6.7"  y2="75" />
          <line x1="50" y1="50" x2="93.3" y2="75" />
        </g>
      </svg>
    );
  }
  if (type === 'rainbow') {
    const wedges = ['oklch(0.85 0.08 25)','oklch(0.87 0.09 55)','oklch(0.90 0.09 95)','oklch(0.85 0.07 145)','oklch(0.84 0.06 230)','oklch(0.82 0.06 310)'];
    const cx = 50, cy = 50, r = 50;
    const toXY = (deg) => [cx + r * Math.cos((deg - 90) * Math.PI / 180), cy + r * Math.sin((deg - 90) * Math.PI / 180)];
    return (
      <svg viewBox="0 0 100 100" style={{ position: 'absolute', inset: rimInset, pointerEvents: 'none' }}>
        <defs><clipPath id="pp-clip-rain"><circle cx="50" cy="50" r="50" /></clipPath></defs>
        <g clipPath="url(#pp-clip-rain)">
          {wedges.map((color, i) => {
            const [x0, y0] = toXY(i * 60), [x1, y1] = toXY((i + 1) * 60);
            return <path key={i} fill={color} opacity={0.55} d={`M${cx},${cy} L${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1} Z`} />;
          })}
          {[0,60,120,180,240,300].map((a, i) => { const [x, y] = toXY(a); return <line key={i} x1="50" y1="50" x2={x} y2={y} stroke={rimColor} strokeWidth="0.35" opacity=".6" />; })}
        </g>
      </svg>
    );
  }
  if (type === 'one-new-thing') {
    return (
      <svg viewBox="0 0 100 100" style={{ position: 'absolute', inset: rimInset, pointerEvents: 'none' }}>
        <polygon points="50,28 54.5,41.5 69,41.5 57.5,50 62,63.5 50,55 38,63.5 42.5,50 31,41.5 45.5,41.5" fill="#f5c842" opacity="0.9" />
      </svg>
    );
  }
  return null;
}

function PlateChip({ type, size = 40 }) {
  const scale = type === 'snack' ? 0.78 : 1;
  const px = size * scale;
  return (
    <div style={{ width: size, height: size, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
      <div style={{ width: px, height: px, borderRadius: '50%', position: 'relative', background: 'radial-gradient(circle at 35% 30%, #fff 0%, #ffffff 55%, #e4e4e4 100%)', boxShadow: '0 1px 3px rgba(60,40,20,.12), inset 0 1px 0 rgba(255,255,255,.6)' }}>
        <div style={{ position: 'absolute', inset: Math.max(3, px * 0.18), borderRadius: '50%', boxShadow: 'inset 0 0 0 1px #e4e4e4', pointerEvents: 'none' }} />
        <div style={{ position: 'absolute', inset: Math.max(3, px * 0.18) }}><PlateShape type={type} rimInset={0} /></div>
      </div>
    </div>
  );
}

function PlatePicker({ value, onChange, displayFont = 'Fraunces, serif', accent = '#2a241c' }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!open) return;
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('pointerdown', h);
    return () => document.removeEventListener('pointerdown', h);
  }, [open]);
  const current = PLATE_TYPES.find(p => p.id === value) || PLATE_TYPES[0];
  return (
    <div ref={ref} style={{ position: 'relative' }}>
      <button onClick={() => setOpen(o => !o)} style={{ display: 'flex', alignItems: 'center', gap: 8, border: '1.5px solid #e4dcc8', background: '#fbf6ea', padding: '6px 14px 6px 8px', borderRadius: 899, cursor: 'pointer', boxShadow: '0 1px 2px rgba(60,40,20,.04)' }}>
        <PlateChip type={current.id} size={28} />
        <span style={{ fontFamily: displayFont, fontSize: 28, fontWeight: 500, letterSpacing: -.3, color: '#2a241c' }}>Plates</span>
      </button>
      {open && (
        <div style={{ position: 'absolute', top: 'calc(100% + 8px)', left: 0, zIndex: 40, background: '#fbf6ea', border: '1px solid #e4dcc8', borderRadius: 16, padding: 10, display: 'grid', gridTemplateColumns: 'repeat(5, 110px)', gap: 6, boxShadow: '0 12px 40px rgba(60,40,20,.12), 0 2px 8px rgba(60,40,20,.06)' }}>
          {PLATE_TYPES.map(pt => {
            const selected = pt.id === value;
            return (
              <button key={pt.id} onClick={() => { onChange(pt.id); setOpen(false); }} style={{ border: selected ? `1.5px solid ${accent}` : '1.5px solid transparent', background: selected ? '#fff' : 'transparent', borderRadius: 12, padding: '12px 8px 10px', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, transition: 'background .15s, border-color .15s' }} onMouseEnter={(e) => { if (!selected) e.currentTarget.style.background = 'rgba(255,255,255,.5)'; }} onMouseLeave={(e) => { if (!selected) e.currentTarget.style.background = 'transparent'; }}>
                <PlateChip type={pt.id} size={56} />

function Plate({ size = 420, items, onRemove, onMove, active, plateType = 'basic', itemSize = 149 }) {
  const plateRef = React.useRef(null);
  const visualSize = plateType === 'snack' ? size * 0.72 : size;
  const [jiggling, setJiggling] = React.useState(false);
  const onItemPointerDown = (e, item) => {
    e.stopPropagation();
    if (jiggling) { onRemove && onRemove(item.uid); return; }
    const el = e.currentTarget;
    const plate = plateRef.current;
    if (!plate) return;
    el.setPointerCapture(e.pointerId);
    const r0 = plate.getBoundingClientRect();
    const grabX = (e.clientX - r0.left) / r0.width * 100 - item.x;
    const grabY = (e.clientY - r0.top) / r0.height * 100 - item.y;
    const start = { x: e.clientX, y: e.clientY };
    let moved = false;
    const longPress = setTimeout(() => { if (!moved) setJiggling(true); }, 500);
    const move = (ev) => {
      const dx = ev.clientX - start.x, dy = ev.clientY - start.y;
      if (!moved && Math.hypot(dx, dy) > 4) { moved = true; clearTimeout(longPress); }
      if (!moved) return;
      const r = plate.getBoundingClientRect();
      const nx_raw = (ev.clientX - r.left) / r.width * 100 - grabX;
      const ny_raw = (ev.clientY - r.top) / r.height * 100 - grabY;
      const ddx = nx_raw - 50, ddy = ny_raw - 50;
      const dist = Math.hypot(ddx, ddy);
      let nx = nx_raw, ny = ny_raw;
      if (dist > 47) {
        el.dataset.willRemove = '1';
        nx = 50 + Math.cos(Math.atan2(ddy, ddx)) * 47;
        ny = 50 + Math.sin(Math.atan2(ddy, ddx)) * 47;
      } else { delete el.dataset.willRemove; }
      onMove && onMove(item.uid, nx, ny);
    };
    const up = () => {
      clearTimeout(longPress);
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', up);
      if (!moved) { onRemove && onRemove(item.uid); return; }
      if (el.dataset.willRemove) { delete el.dataset.willRemove; onRemove && onRemove(item.uid); }
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  };
  return (
    <div ref={plateRef} onClick={() => { if (jiggling) setJiggling(false); }} style={{ position: 'relative', width: visualSize, height: visualSize, borderRadius: '50%', background: `radial-gradient(circle at 35% 30%, #fff 0%, ${CHILD_COLORS.plate} 55%, ${CHILD_COLORS.plateRim} 100%)`, boxShadow: active ? `0 12px 48px ${CHILD_COLORS.plateShadow}, 0 0 0 4px ${CHILD_COLORS.sage}33, inset 0 2px 0 rgba(255,255,255,.6), inset 0 -6px 0 rgba(60,40,20,.05)` : `0 10px 40px ${CHILD_COLORS.plateShadow}, inset 0 2px 0 rgba(255,255,255,.6), inset 0 -6px 0 rgba(60,40,20,.05)`, transition: 'box-shadow .25s, width .25s, height .25s' }}>
      <div style={{ position: 'absolute', inset: 18, borderRadius: '50%', boxShadow: `inset 0 0 0 1px ${CHILD_COLORS.plateRim}, inset 0 0 0 2px rgba(255,255,255,.4)`, pointerEvents: 'none' }} />
      <PlateShape type={plateType} plateColor={CHILD_COLORS.plate} rimColor={CHILD_COLORS.plateRim} />
      {items.map((it, i) => (
        <div key={it.uid} onPointerDown={(e) => onItemPointerDown(e, it)} style={{ position: 'absolute', left: `${it.x}%`, top: `${it.y}%`, transform: 'translate(-50%, -50%)', cursor: jiggling ? 'pointer' : 'grab', touchAction: 'none', userSelect: 'none', animation: jiggling ? `ppJiggle .35s ease-in-out ${i * 0.07}s infinite alternate` : 'ppPlacedIn .32s cubic-bezier(.2,.8,.3,1.1)' }}>

        </div>
      ))}
    </div>

                <div style={{ width: 7, height: 7, borderRadius: '50%', background: CARE_COLORS.sageDeep, flexShrink: 0, animation: 'ppPulse 1.6s ease-in-out infinite' }} />

        <div style={{ display: 'flex', gap: 6, marginTop: 14, background: '#fff', borderRadius: 12, padding: 4, border: `1px solid ${CARE_COLORS.lineSoft}` }}>

          <div style={{ display: 'flex', alignItems: 'baseline', gap: 10 }}>

            <div style={{ fontSize: 13, color: CARE_COLORS.muted, fontWeight: 500 }}>{menu.length} {menu.length === 1 ? 'item' : 'items'}</div>
          </div>
        </div>
        <div style={{ background: '#fff', borderRadius: 16, padding: 12, border: `1px solid ${CARE_COLORS.lineSoft}`, display: 'flex', flexWrap: 'wrap', gap: 8, minHeight: 56 }}>
          {menu.length === 0 && (
            <div style={{ width: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '12px 0 4px', gap: 4 }}>
              <PlateHero size={72} />
              <div style={{ fontSize: 13, color: CARE_COLORS.muted, fontFamily: careFont, fontWeight: 500 }}>Tap to build today's menu.</div>
            </div>
          )}
          {menu.map(id => <FoodChip key={id} id={id} onRemove={() => toggleFood(id)} />)}
          <div style={{ width: '100%', display: 'flex', justifyContent: 'center', marginTop: menu.length > 0 ? 4 : 0 }}>
            <button onClick={() => setKitchenOpen(true)} style={{ padding: '8px 20px', background: CARE_COLORS.sageDeep, border: 'none', borderRadius: 899, cursor: 'pointer', fontFamily: careFont, fontSize: 14, fontWeight: 600, color: '#fbf6ea', boxShadow: '0 4px 14px rgba(40,80,40,.15)' }}>
              Kitchen

          </div>
        </div>

        {/* Plate picker row */}
        <div onClick={() => setPickingPlate(true)} style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 12, padding: '12px 14px', background: '#fff', borderRadius: 12, border: `1px solid ${CARE_COLORS.lineSoft}`, cursor: 'pointer' }}>
          <PlateChip type={plateType} size={28} />
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 13, color: CARE_COLORS.muted, fontWeight: 500 }}>Plate</div>
            <div style={{ fontSize: 15, fontWeight: 600, color: CARE_COLORS.ink, marginTop: 1 }}>{PLATE_TYPES.find(p => p.id === plateType)?.label}</div>
          </div>
          <span style={{ fontSize: 13, color: CARE_COLORS.sageDeep, fontWeight: 600 }}>Change</span>
        </div>

        {menu.length > 0 && (
          <div style={{ marginTop: 12, position: 'relative' }}>
            {!saved && (
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 8 }}>
                <div style={{ width: 7, height: 7, borderRadius: '50%', background: CARE_COLORS.sageDeep, animation: 'ppSpin 1.8s ease-in-out infinite', boxShadow: `0 0 0 2px ${CARE_COLORS.sageSoft}` }} />
                <span style={{ fontFamily: careFont, fontSize: 12, fontWeight: 600, color: CARE_COLORS.sageDeep }}>Ready to send — {childName} is waiting</span>
              </div>
            )}
            <button onClick={handleSave} style={{ width: '100%', border: 'none', padding: '16px', borderRadius: 12, background: saved ? '#8BBF6A' : CARE_COLORS.sageDeep, color: '#fbf6ea', fontFamily: careFont, fontSize: 16, fontWeight: 600, cursor: 'pointer', boxShadow: '0 4px 14px rgba(40,80,40,.15)', transition: 'background .2s', animation: saved ? 'ppButtonBounce .5s cubic-bezier(.2,.8,.3,1.2)' : 'none' }}>
              {saved ? `✓ ${mealLabel} menu sent` : `Send ${childName}'s ${mealLabel} Menu`}
            </button>
          </div>
        )}
        <div style={{ marginTop: 20 }}>
          <div style={{ fontSize: 12, color: CARE_COLORS.muted, fontWeight: 600, letterSpacing: .6, textTransform: 'uppercase', marginBottom: 8 }}>Saved Menus</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {savedMenus.map(m => (
              <div key={m.id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '13px 14px', background: '#fff', borderRadius: 12, border: `1px solid ${CARE_COLORS.lineSoft}` }}>
                <div>
                  <div style={{ fontSize: 15, fontWeight: 600, color: CARE_COLORS.ink }}>{m.name}</div>
                  <div style={{ fontSize: 12, color: CARE_COLORS.muted, marginTop: 2 }}>{m.meal} · {m.ids.length} items</div>
                </div>
                <button onClick={() => onSetMenu(m.ids)} style={{ border: `1.5px solid ${CARE_COLORS.sage}`, background: 'transparent', color: CARE_COLORS.sageDeep, padding: '7px 14px', borderRadius: 899, fontFamily: careFont, fontSize: 13, fontWeight: 600, cursor: 'pointer', flexShrink: 0 }}>Use</button>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Plate picker sheet */}
      {pickingPlate && (
        <div onClick={() => setPickingPlate(false)} style={{ position: 'absolute', inset: 0, zIndex: 40, background: 'rgba(40,30,20,.25)', display: 'flex', alignItems: 'flex-end' }}>
          <div onClick={e => e.stopPropagation()} style={{ width: '100%', background: CARE_COLORS.bg, borderRadius: '20px 20px 0 0', padding: '14px 20px 40px', animation: 'sheetUp .25s cubic-bezier(.2,.8,.3,1)' }}>
            <div style={{ width: 36, height: 4, borderRadius: 2, background: CARE_COLORS.line, margin: '0 auto 16px' }} />
            <div style={{ fontFamily: serifFont, fontSize: 22, fontWeight: 500, color: CARE_COLORS.ink, marginBottom: 20 }}>Choose a plate</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 8 }}>
              {PLATE_TYPES.map(pt => {
                const selected = pt.id === plateType;
                return (
                  <div key={pt.id} onClick={() => { setPlateType(pt.id); setPickingPlate(false); }} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, padding: '12px 4px 10px', borderRadius: 12, border: selected ? `1.5px solid ${CARE_COLORS.sageDeep}` : '1.5px solid transparent', background: selected ? '#fff' : 'transparent', cursor: 'pointer' }}>
                    <PlateChip type={pt.id} size={52} />
                    <div style={{ fontFamily: serifFont, fontSize: 13, fontWeight: 500, color: CARE_COLORS.ink, textAlign: 'center' }}>{pt.label}</div>
                    <div style={{ fontFamily: careFont, fontSize: 10, color: CARE_COLORS.muted, textAlign: 'center', lineHeight: 1.3 }}>{pt.caption}</div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {/* Confirmation — shown when switching meal tabs would wipe a non-empty menu */}
      {pendingMeal && (
        <div style={{ position: 'absolute', inset: 0, zIndex: 55, background: 'rgba(40,30,20,.2)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '0 24px', animation: 'ppFadeIn .15s ease' }}>
          <div style={{ background: '#fff', borderRadius: 16, padding: '22px 20px 18px', width: '100%', boxShadow: '0 8px 32px rgba(0,0,0,.18)' }}>
            <div style={{ fontFamily: serifFont, fontSize: 17, fontWeight: 600, color: CARE_COLORS.ink, marginBottom: 6 }}>Switch to {pendingMeal.label}?</div>
            <div style={{ fontFamily: careFont, fontSize: 13, color: CARE_COLORS.muted, marginBottom: 18, lineHeight: 1.4 }}>Your {mealLabel} menu ({menu.length} {menu.length === 1 ? 'item' : 'items'}) will be cleared.</div>
            <div style={{ display: 'flex', gap: 10 }}>
              <button onClick={() => setPendingMeal(null)} style={{ flex: 1, border: `1.5px solid ${CARE_COLORS.line}`, background: 'transparent', borderRadius: 10, padding: '11px 0', fontFamily: careFont, fontSize: 14, fontWeight: 600, color: CARE_COLORS.mutedStrong, cursor: 'pointer' }}>Cancel</button>
              <button onClick={confirmSwitch} style={{ flex: 1, border: 'none', background: CARE_COLORS.sageDeep, borderRadius: 10, padding: '11px 0', fontFamily: careFont, fontSize: 14, fontWeight: 600, color: '#fff', cursor: 'pointer' }}>Switch</button>
            </div>
          </div>
        </div>
      )}

      {/* Kitchen sheet */}
      {kitchenOpen && (
        <div onClick={() => { setKitchenOpen(false); setKitchenQuery(''); }} style={{ position: 'absolute', inset: 0, zIndex: 40, background: 'rgba(40,30,20,.25)', display: 'flex', alignItems: 'flex-end' }}>
          <div onClick={e => e.stopPropagation()} style={{ width: '100%', maxHeight: '82%', background: CARE_COLORS.bg, borderRadius: '20px 20px 0 0', display: 'flex', flexDirection: 'column', animation: 'sheetUp .25s cubic-bezier(.2,.8,.3,1)' }}>
            <div style={{ padding: '14px 20px 0', flexShrink: 0 }}>
              <div style={{ width: 36, height: 4, borderRadius: 2, background: CARE_COLORS.line, margin: '0 auto 16px' }} />
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
                <div style={{ fontFamily: serifFont, fontSize: 22, fontWeight: 500, color: CARE_COLORS.ink }}>Kitchen</div>
                <div onClick={() => { setKitchenOpen(false); setKitchenQuery(''); onOpenPantry && onOpenPantry(); }} style={{ fontSize: 13, fontWeight: 600, color: CARE_COLORS.sageDeep, cursor: 'pointer', fontFamily: careFont }}>Add to Kitchen</div>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, background: '#fff', border: `1px solid ${CARE_COLORS.line}`, borderRadius: 10, padding: '9px 12px', marginBottom: 14 }}>
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style={{ flexShrink: 0 }}><circle cx="6" cy="6" r="4.5" stroke={CARE_COLORS.muted} strokeWidth="1.5"/><line x1="9.5" y1="9.5" x2="12.5" y2="12.5" stroke={CARE_COLORS.muted} strokeWidth="1.5" strokeLinecap="round"/></svg>
                <input value={kitchenQuery} onChange={e => setKitchenQuery(e.target.value)} placeholder="Search kitchen…" style={{ flex: 1, border: 'none', outline: 'none', background: 'transparent', fontFamily: careFont, fontSize: 14, color: CARE_COLORS.ink }} />
                {kitchenQuery && <div onClick={() => setKitchenQuery('')} style={{ color: CARE_COLORS.muted, cursor: 'pointer', fontSize: 16, lineHeight: 1, marginTop: -1 }}>×</div>}
              </div>
              <PillFilterRows textureFilter={textureFilter} setTextureFilter={setTextureFilter} tempFilter={tempFilter} setTempFilter={setTempFilter} typeFilter={typeFilter} setTypeFilter={setTypeFilter} />
            </div>
            <div style={{ flex: 1, overflow: 'auto', padding: '0 20px 32px' }}>
              {(() => {
                const q = kitchenQuery.trim().toLowerCase();
                const hasFilter = q || textureFilter || tempFilter || typeFilter;
                const filterIds = (ids) => ids.filter(id => {
                  if (q && !FOOD_CATALOG[id]?.name.toLowerCase().includes(q)) return false;
                  const meta = FOOD_META[id];
                  if (meta) {
                    if (textureFilter && !meta.textures.includes(textureFilter)) return false;
                    if (tempFilter && !meta.temps.includes(tempFilter)) return false;
                    if (typeFilter && meta.type !== typeFilter) return false;
                  }
                  return true;
                });
                const cats = kitchenCats.map(cat => ({ ...cat, ids: filterIds(cat.ids) })).filter(cat => cat.ids.length > 0);
                if (hasFilter && cats.length === 0) return <div style={{ fontFamily: careFont, fontSize: 14, color: CARE_COLORS.muted, textAlign: 'center', marginTop: 32 }}>No results found</div>;
                return cats.map(cat => (
                <div key={cat.label} style={{ marginBottom: 24 }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: CARE_COLORS.muted, letterSpacing: .7, textTransform: 'uppercase', marginBottom: 10, fontFamily: careFont }}>{cat.label}</div>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 10 }}>
                    {cat.ids.map(id => {
                      const onMenu = menu.includes(id);
                      return (
                        <div key={id} onClick={() => toggleFood(id)} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, padding: '12px 6px 10px', borderRadius: 12, background: onMenu ? '#E4F3DC' : '#fff', border: onMenu ? `1.5px solid #A9D18E` : `1px solid ${CARE_COLORS.lineSoft}`, cursor: 'pointer', position: 'relative', transition: 'background .15s, border-color .15s' }}>
                          <FoodImage id={id} size={52} />
                          <div style={{ fontSize: 12, fontWeight: 600, color: CARE_COLORS.ink, textAlign: 'center', lineHeight: 1.2, fontFamily: careFont }}>{FOOD_CATALOG[id].name}</div>
                          {onMenu && (
                            <div style={{ position: 'absolute', top: 6, right: 6, width: 16, height: 16, borderRadius: '50%', background: '#6B9E52', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                              <svg width="8" height="8" viewBox="0 0 8 8" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M1.5 4l1.8 1.8L6.5 2"/></svg>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              ));
              })()}
            </div>
            <div style={{ padding: '12px 20px 24px', flexShrink: 0 }}>
              <button onClick={() => { setKitchenOpen(false); setKitchenQuery(''); }} style={{ width: '100%', padding: '13px 0', borderRadius: 12, background: CARE_COLORS.sageDeep, border: 'none', color: '#fbf6ea', fontSize: 15, fontWeight: 600, fontFamily: careFont, cursor: 'pointer', boxShadow: '0 4px 14px rgba(40,80,40,.15)' }}>
                {menu.length > 0 ? `Back to menu · ${menu.length} ${menu.length === 1 ? 'item' : 'items'}` : 'Back to menu'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function CareNotification({ childName = 'Mira', pickedPlate, onSaveMenu }) {
  const [saved, setSaved] = React.useState(false);
  const [dismissed, setDismissed] = React.useState(false);
  const [swipeX, setSwipeX] = React.useState(0);
  const [dismissing, setDismissing] = React.useState(false);
  const handleSwipe = (e) => {
    const startX = e.clientX;
    const el = e.currentTarget;
    el.setPointerCapture(e.pointerId);
    let dx = 0;
    const move = (ev) => { dx = ev.clientX - startX; setSwipeX(dx); };
    const up = () => {
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      if (Math.abs(dx) > 80) { setDismissing(true); setTimeout(() => setDismissed(true), 300); }
      else setSwipeX(0);
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
  };

  if (!pickedPlate) {
    return (
      <div style={{ position: 'relative', height: '100%', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
        <CareStatusBar />
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 12, padding: '0 40px', textAlign: 'center' }}>
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke={CARE_COLORS.line} strokeWidth="2" strokeLinecap="round"><circle cx="20" cy="20" r="15"/><path d="M20 13v7l4 4"/></svg>
          <div style={{ fontFamily: serifFont, fontSize: 22, fontWeight: 500, letterSpacing: -.3, color: CARE_COLORS.muted, lineHeight: 1.3 }}>Waiting for {childName} to pick her plate.</div>
          <div style={{ fontFamily: careFont, fontSize: 14, color: CARE_COLORS.muted, lineHeight: 1.5 }}>This is where you'll be able to track your child's choices.</div>
        </div>
      </div>
    );
  }

  const items     = pickedPlate.items;
  const plateType = pickedPlate.plateType || 'basic';
  const foodIds   = [...new Set(items.map(it => it.id))];
  const plateLabel = { basic: 'Basic round plate', divided: 'Divided plate', rainbow: 'Rainbow plate', 'one-new-thing': 'One new thing', snack: 'Snack plate' }[plateType] || 'Round plate';
  const timeLabel = pickedPlate.submittedAt
    ? new Date(pickedPlate.submittedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
    : null;

  const historicalFoods = new Set(SAVED_MENUS_DATA.flatMap(m => m.ids));
  const familiarFoods = foodIds.filter(id => historicalFoods.has(id));
  const newFoods = foodIds.filter(id => !historicalFoods.has(id));
  const nameList = ids => { const ns = ids.map(id => FOOD_CATALOG[id]?.name).filter(Boolean); return ns.length <= 2 ? ns.join(' and ') : ns.slice(0,-1).join(', ') + ' and ' + ns.slice(-1); };

  let headline, subline, insightTag;
  if (SAVED_MENUS_DATA.length === 0) {
    headline = `${childName} built her first plate.`;
    subline = `${foodIds.length} ${foodIds.length === 1 ? 'food' : 'foods'} chosen.`;
    insightTag = 'First plate';
  } else if (newFoods.length > 0 && familiarFoods.length > 0) {
    headline = `${familiarFoods.length} familiar, ${newFoods.length} new.`;
    subline = `First time with ${nameList(newFoods)}.`;
    insightTag = newFoods.length === 1 ? '1 new food' : `${newFoods.length} new foods`;
  } else if (newFoods.length > 0) {
    headline = `${newFoods.length === 1 ? 'One new food' : `${newFoods.length} new foods`} today.`;
    subline = `First time with ${nameList(newFoods)}.`;
    insightTag = newFoods.length === 1 ? '1 new food' : `${newFoods.length} new foods`;
  } else {
    headline = `${childName} chose familiar foods today.`;
    subline = `${familiarFoods.length} ${familiarFoods.length === 1 ? 'food' : 'foods'} from her usual picks.`;
    insightTag = null;
  }

  return (
    <div style={{ position: 'relative', height: '100%', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      <CareStatusBar />
      <div style={{ flex: 1, overflow: 'auto', padding: '6px 20px 120px', fontFamily: careFont }}>
        <style>{`@keyframes notifSlide { from { transform: translateY(-20px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }`}</style>
        {!dismissed && <div onPointerDown={handleSwipe} style={{ marginTop: 4, padding: '12px 14px', background: '#fff', borderRadius: 16, border: `1px solid ${CARE_COLORS.lineSoft}`, boxShadow: '0 4px 16px rgba(40,30,20,.06)', animation: 'notifSlide .45s cubic-bezier(.2,.9,.3,1)', cursor: 'grab', transform: dismissing ? `translateX(${swipeX >= 0 ? '120%' : '-120%'})` : `translateX(${swipeX}px)`, transition: (dismissing || swipeX === 0) ? 'transform .3s ease, opacity .3s' : 'none', opacity: dismissing ? 0 : 1 }}>
          <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
            <div style={{ width: 32, height: 32, borderRadius: 7, background: `radial-gradient(circle at 30% 30%, ${CARE_COLORS.sageSoft}, ${CARE_COLORS.sage})`, flexShrink: 0 }} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 2 }}>
                <span style={{ fontSize: 13, fontWeight: 700, color: CARE_COLORS.ink }}>Pick Your Plate</span>
                <span style={{ fontSize: 11, color: CARE_COLORS.muted }}>{timeLabel || 'now'}</span>
              </div>
              <div style={{ fontSize: 14, color: CARE_COLORS.ink, fontWeight: 600 }}>{childName} built her plate.</div>
              <div style={{ fontSize: 13, color: CARE_COLORS.mutedStrong, marginTop: 1, lineHeight: 1.35 }}>{foodIds.length} {foodIds.length === 1 ? 'food' : 'foods'} chosen.</div>
            </div>
          </div>
        </div>}
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginTop: 24 }}>
          <PlateHero size={80} />
          <div>
            <div style={{ fontFamily: serifFont, fontSize: 26, fontWeight: 500, letterSpacing: -.4, color: CARE_COLORS.ink, lineHeight: 1.15 }}>{headline}</div>
            <div style={{ fontSize: 14, color: CARE_COLORS.muted, marginTop: 4 }}>{subline}</div>
            {timeLabel && <div style={{ fontSize: 12, color: CARE_COLORS.muted, marginTop: 5, fontFamily: careFont }}>Submitted at {timeLabel}</div>}
            {insightTag && <div style={{ display: 'inline-block', marginTop: 8, fontSize: 12, fontWeight: 700, letterSpacing: .4, textTransform: 'uppercase', color: CARE_COLORS.sageDeep, background: CARE_COLORS.sageSoft, padding: '3px 10px', borderRadius: 899 }}>{insightTag}</div>}
          </div>
        </div>
        <div style={{ marginTop: 22, padding: 24, background: '#fff', borderRadius: 20, border: `1px solid ${CARE_COLORS.lineSoft}`, display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
          <div style={{ position: 'relative', width: 220, height: 220 }}>
            <div style={{ position: 'absolute', inset: 0, borderRadius: '50%', background: `radial-gradient(circle at 35% 30%, #fff, #ffffff 55%, #e4e4e4 100%)`, boxShadow: '0 6px 22px rgba(60,40,20,.1), inset 0 2px 0 rgba(255,255,255,.6)' }} />
            <PlateShape type={plateType} plateColor="#ffffff" rimColor="#e4e4e4" />
            {items.map(it => (
              <div key={it.uid} style={{ position: 'absolute', left: `${it.x}%`, top: `${it.y}%`, transform: 'translate(-50%, -50%)' }}>
                <FoodImage id={it.id} size={72} />
              </div>
            ))}
          </div>
          <div style={{ fontSize: 12, color: CARE_COLORS.muted, fontWeight: 600, letterSpacing: .6, textTransform: 'uppercase', marginTop: 18 }}>{plateLabel}</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, justifyContent: 'center', marginTop: 10 }}>
            {foodIds.map(id => <span key={id} style={{ fontSize: 13, fontWeight: 600, color: CARE_COLORS.ink, padding: '4px 10px', borderRadius: 899, background: CARE_COLORS.surface }}>{FOOD_CATALOG[id].name}</span>)}
          </div>
        </div>
        <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10, padding: '12px 14px', background: CARE_COLORS.sageSoft, borderRadius: 12, marginTop: 4 }}>
          <img src="./platey_home_transparent.png" style={{ width: 36, height: 36, objectFit: 'contain', flexShrink: 0 }} />
          <p style={{ margin: 0, fontSize: 13, color: CARE_COLORS.sageDeep, lineHeight: 1.5, fontFamily: careFont, fontWeight: 500 }}>
            {newFoods.length > 0 && familiarFoods.length > 0
              ? "You've been offering a nice mix of familiar and new — that's exactly how comfort with food grows."
              : newFoods.length > 0
              ? "All new foods today — consider pairing with something familiar next time to keep it low-stress."
              : "Staying with familiar foods is totally valid. Consistency builds trust over time."}
          </p>
        </div>

function CareLibrary({ childName = 'Mira', savedMenus = [], kitchenIds = [], onAddToKitchen, onAddToMenu, onDone }) {

  const [tempFilter, setTempFilter] = React.useState(null);
  const [typeFilter, setTypeFilter] = React.useState(null);
  const toggle = (id) => setKitchenFoods(xs => xs.includes(id) ? xs.filter(x => x !== id) : [...xs, id]);
  const newlyAdded = kitchenFoods.filter(id => !kitchenIds.includes(id));

  const q = query.trim().toLowerCase();
  const hasMetaFilter = textureFilter || tempFilter || typeFilter;

          />
          {q && (
            <div onClick={() => setQuery('')} style={{ cursor: 'pointer', color: CARE_COLORS.muted, lineHeight: 1 }}>

            ))}

          </>
        )}
      </div>
      <div style={{ padding: '12px 20px 88px', flexShrink: 0, borderTop: `1px solid ${CARE_COLORS.lineSoft}`, background: CARE_COLORS.bg }}>
        <button onClick={() => { onAddToKitchen && onAddToKitchen(kitchenFoods); onAddToMenu && onAddToMenu(newlyAdded); onDone(); }} style={{ width: '100%', border: 'none', padding: '16px', borderRadius: 12, fontFamily: careFont, fontSize: 16, fontWeight: 600, background: CARE_COLORS.sageDeep, color: '#fbf6ea', cursor: 'pointer', boxShadow: '0 4px 14px rgba(40,80,40,.15)' }}>

function AppleNotifBanner({ childName, pickedPlate, onDismiss, onTap }) {
  const [swipeX, setSwipeX] = React.useState(0);
  const [dismissing, setDismissing] = React.useState(false);

  const items = pickedPlate?.items || [];
  const foodIds = [...new Set(items.map(it => it.id))];
  const historicalFoods = new Set(SAVED_MENUS_DATA.flatMap(m => m.ids));
  const newFoods = foodIds.filter(id => !historicalFoods.has(id));
  const familiarFoods = foodIds.filter(id => historicalFoods.has(id));
  const nameList = ids => { const ns = ids.map(id => FOOD_CATALOG[id]?.name).filter(Boolean); return ns.length <= 2 ? ns.join(' and ') : ns.slice(0,-1).join(', ') + ' and ' + ns.slice(-1); };

  let headline, subline;
  if (newFoods.length > 0 && familiarFoods.length > 0) {
    headline = `${familiarFoods.length} familiar, ${newFoods.length} new.`;
    subline = `First time with ${nameList(newFoods)}.`;
  } else if (newFoods.length > 0) {
    headline = `${newFoods.length === 1 ? 'One new food' : `${newFoods.length} new foods`} today.`;
    subline = `First time with ${nameList(newFoods)}.`;
  } else {
    headline = `${childName} built her plate.`;
    subline = `${foodIds.length} ${foodIds.length === 1 ? 'food' : 'foods'} chosen.`;
  }

  const dismiss = () => { setDismissing(true); setTimeout(onDismiss, 320); };

  const handleSwipe = (e) => {
    const startX = e.clientX;
    const el = e.currentTarget;
    el.setPointerCapture(e.pointerId);
    let dx = 0;
    const move = (ev) => { dx = ev.clientX - startX; setSwipeX(dx); };
    const up = () => {
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      if (Math.abs(dx) > 60) dismiss();
      else if (Math.abs(dx) < 5) { dismiss(); onTap && onTap(); }
      else setSwipeX(0);
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
  };

  return (
    <div style={{ position: 'absolute', top: 54, left: 12, right: 12, zIndex: 45, pointerEvents: 'auto' }}>
      <style>{`@keyframes notifSlideDown { from { transform: translateY(-72px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }`}</style>
      <div onPointerDown={handleSwipe} style={{ padding: '12px 14px', background: 'rgba(255,255,255,.96)', backdropFilter: 'blur(20px)', borderRadius: 16, boxShadow: '0 8px 28px rgba(40,30,20,.16)', animation: 'notifSlideDown .38s cubic-bezier(.2,.9,.3,1)', cursor: 'grab', transform: dismissing ? 'translateY(-80px)' : `translateX(${swipeX}px)`, transition: (dismissing || swipeX === 0) ? 'transform .32s ease, opacity .32s' : 'none', opacity: dismissing ? 0 : 1 }}>
        <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
          <div style={{ width: 32, height: 32, borderRadius: 7, background: `radial-gradient(circle at 30% 30%, ${CARE_COLORS.sageSoft}, ${CARE_COLORS.sage})`, flexShrink: 0, overflow: 'hidden', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <img src="./pyp_logo.png" style={{ width: 26, height: 26, objectFit: 'contain' }} />
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 2 }}>
              <span style={{ fontSize: 13, fontWeight: 700, color: CARE_COLORS.ink, fontFamily: careFont }}>Pick Your Plate</span>
              <span style={{ fontSize: 12, color: CARE_COLORS.sageDeep, fontFamily: careFont, fontWeight: 600, cursor: 'pointer' }} onClick={e => { e.stopPropagation(); dismiss(); onTap && onTap(); }}>View →</span>
            </div>
            <div style={{ fontSize: 14, color: CARE_COLORS.ink, fontWeight: 600, fontFamily: careFont }}>{headline}</div>
            <div style={{ fontSize: 13, color: CARE_COLORS.mutedStrong, marginTop: 1, lineHeight: 1.35, fontFamily: careFont }}>{subline}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function CaretakerApp({ childName = 'Mira', pickedPlate, onSendMenu }) {
  const [screen, setScreen] = React.useState('welcome');
  const [savedMenus, setSavedMenus] = React.useState([]);
  const [lastSeenPlate, setLastSeenPlate] = React.useState(null);
  const [kitchenIds, setKitchenIds] = React.useState(() => [...new Set(KITCHEN.flatMap(c => c.ids))]);
  const [menu, setMenu] = React.useState([]);
  const [showBanner, setShowBanner] = React.useState(false);
  const prevPlateRef = React.useRef(null);

  React.useEffect(() => {
    if (pickedPlate && pickedPlate !== prevPlateRef.current) {
      prevPlateRef.current = pickedPlate;
      setShowBanner(true);
      const t = setTimeout(() => setShowBanner(false), 15000);
      return () => clearTimeout(t);
    }
  }, [pickedPlate]);

  const addToKitchen = (ids) => setKitchenIds([...new Set(ids)]);
  const addToMenu = (ids) => setMenu(xs => [...new Set([...xs, ...ids])]);
  const hasUnseenActivity = pickedPlate !== null && pickedPlate !== lastSeenPlate;
  const addSavedMenu = (entry) => setSavedMenus(xs => [...xs, { id: Date.now(), ...entry }]);
  const goToActivity = () => { setLastSeenPlate(pickedPlate); setScreen('notification'); };
  return (
    <CareFrame>
      {screen === 'welcome'      && <CareWelcome      onStart={() => setScreen('today')} />}
      {screen === 'today'        && <CareToday        childName={childName} savedMenus={savedMenus} kitchenIds={kitchenIds} menu={menu} onSetMenu={setMenu} onSaved={goToActivity} onSendMenu={onSendMenu} onOpenPantry={() => setScreen('library')} pickedPlate={pickedPlate} onViewActivity={goToActivity} />}
      {screen === 'notification' && <CareNotification childName={childName} pickedPlate={pickedPlate} onSaveMenu={addSavedMenu} />}
      {screen === 'library'      && <CareLibrary      childName={childName} savedMenus={savedMenus} kitchenIds={kitchenIds} onAddToKitchen={addToKitchen} onAddToMenu={addToMenu} onDone={() => setScreen('today')} />}
      {screen === 'settings'     && (
        <div style={{ position: 'relative', height: '100%', display: 'flex', flexDirection: 'column' }}>
          <CareStatusBar />
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 10, padding: '0 40px', textAlign: 'center' }}>
            <svg width="36" height="36" viewBox="0 0 36 36" fill="none" stroke={CARE_COLORS.line} strokeWidth="1.8" strokeLinecap="round"><circle cx="18" cy="18" r="7"/><path d="M18 3v3M18 30v3M3 18h3M30 18h3M7.5 7.5l2 2M26.5 26.5l2 2M7.5 28.5l2-2M26.5 9.5l2-2"/></svg>
            <div style={{ fontFamily: serifFont, fontSize: 22, fontWeight: 500, letterSpacing: -.3, color: CARE_COLORS.muted }}>Settings</div>
            <div style={{ fontFamily: careFont, fontSize: 13, color: CARE_COLORS.muted, lineHeight: 1.5 }}>Coming soon.</div>
          </div>
        </div>
      )}
      {showBanner && screen !== 'notification' && <AppleNotifBanner childName={childName} pickedPlate={pickedPlate} onDismiss={() => setShowBanner(false)} onTap={() => { setShowBanner(false); setLastSeenPlate(pickedPlate); setScreen('notification'); }} />}
      {screen !== 'welcome' && <CareTabBar active={screen} onTab={(tab) => { if (tab === 'notification') setLastSeenPlate(pickedPlate); setScreen(tab); }} hasActivity={hasUnseenActivity} />}
    </CareFrame>
  );
}

          </div>
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 }}>
            <div style={{ fontFamily: 'Inter, system-ui', fontSize: 13, fontWeight: 600, color: 'rgba(60,50,40,.5)', letterSpacing: .5, textTransform: 'uppercase' }}>Child · iPad</div>
            <ChildApp childName="Mira" onSubmit={handlePickedPlate} sentMenu={sentMenu} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
