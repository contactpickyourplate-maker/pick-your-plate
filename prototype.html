function FoodImage({ id, size = 80 }) {
  const f = FOOD_CATALOG[id];
  const [src, setSrc] = React.useState(`./${id}.webp`);
  const [err, setErr] = React.useState(false);
  if (!f) return null;
  const handleError = () => {
    if (src === `./${id}.webp`) setSrc(`./${id}.png`);
    else setErr(true);
  };
  return (
    <div style={{ width: size, height: size, borderRadius: '50%', background: err ? f.color : '#ffffff', overflow: 'hidden', boxShadow: '0 1px 2px rgba(0,0,0,.08), inset 0 0 0 1px rgba(0,0,0,.03)', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      {err
        ? <span style={{ fontSize: Math.round(size * .38), fontWeight: 700, color: f.accent, fontFamily: 'Nunito, system-ui' }}>{f.name[0]}</span>
        : <img src={src} width={size} height={size} draggable={false} style={{ display: 'block', objectFit: 'contain', pointerEvents: 'none' }} onError={handleError} />
      }
    </div>
  );
}

  <script type="text/babel">
const PLATE_TYPES = [
  { id: 'basic',         label: 'Basic',       caption: 'Round plate'        },
  { id: 'rainbow',       label: 'Rainbow',     caption: 'Color by color'     },
  { id: 'one-new-thing', label: '1 New Thing', caption: 'Spotlight one food' },
  { id: 'snack',         label: 'Snack',       caption: 'Smaller plate'      },
];

function PlateShape({ type = 'basic', plateColor = '#ffffff', rimColor = '#e4e4e4', rimInset = 18, chip = false }) {
  const svgStyle = { position: 'absolute', top: rimInset, left: rimInset, width: `calc(100% - ${rimInset * 2}px)`, height: `calc(100% - ${rimInset * 2}px)`, pointerEvents: 'none', display: 'block' };
  if (type === 'divided') {
    return (
      <svg viewBox="0 0 100 100" style={svgStyle}>
        <defs><clipPath id="pp-clip-div"><circle cx="50" cy="50" r="50" /></clipPath></defs>
        <g clipPath="url(#pp-clip-div)" stroke={rimColor} strokeWidth="0.5" strokeLinecap="round">
          <line x1="50" y1="50" x2="50"  y2="0"  />
          <line x1="50" y1="50" x2="93.3" y2="75" />
          <line x1="50" y1="50" x2="6.7"  y2="75" />
        </g>
      </svg>
    );
  }
  if (type === 'rainbow') {
    const wedges = ['oklch(0.85 0.08 25)','oklch(0.87 0.09 55)','oklch(0.90 0.09 95)','oklch(0.85 0.07 145)','oklch(0.84 0.06 230)','oklch(0.82 0.06 310)'];
    const cx = 50, cy = 50, r = 50;
    const toXY = (deg) => [cx + r * Math.cos((deg - 90) * Math.PI / 180), cy + r * Math.sin((deg - 90) * Math.PI / 180)];
    return (
      <svg viewBox="0 0 100 100" style={svgStyle}>
        <defs><clipPath id="pp-clip-rain"><circle cx="50" cy="50" r="50" /></clipPath></defs>
        <g clipPath="url(#pp-clip-rain)">
          {wedges.map((color, i) => {
            const [x0, y0] = toXY(i * 60), [x1, y1] = toXY((i + 1) * 60);
            return <path key={i} fill={color} opacity={0.55} d={`M${cx},${cy} L${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1} Z`} />;
          })}
          {[0,60,120,180,240,300].map((a, i) => { const [x, y] = toXY(a); return <line key={i} x1="50" y1="50" x2={x} y2={y} stroke={rimColor} strokeWidth="0.35" opacity=".6" />; })}
        </g>
      </svg>
    );
  }
  if (type === 'one-new-thing') {
    if (chip) {
      return (
        <svg viewBox="0 0 100 100" style={svgStyle}>
          <polygon points="50,28 54.5,41.5 69,41.5 57.5,50 62,63.5 50,55 38,63.5 42.5,50 31,41.5 45.5,41.5" fill="#f5c842" opacity="0.9" />
        </svg>
      );
    }
    return (
      <svg viewBox="0 0 100 100" style={svgStyle}>
        <circle cx="68" cy="32" r="16" fill="#f5c842" fillOpacity="0.18" stroke="#f5c842" strokeWidth="1.5" strokeDasharray="3,2" />
        <polygon points="68,23 70.65,28.36 76.56,29.22 72.28,33.39 73.29,39.28 68,36.5 62.71,39.28 63.72,33.39 59.44,29.22 65.35,28.36" fill="#f5c842" opacity="0.9" />
      </svg>
    );
  }
  return null;
}

function PlateChip({ type, size = 40 }) {
  const scale = type === 'snack' ? 0.78 : 1;
  const px = size * scale;
  return (
    <div style={{ width: size, height: size, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
      <div style={{ width: px, height: px, borderRadius: '50%', position: 'relative', background: 'radial-gradient(circle at 35% 30%, #fff 0%, #ffffff 55%, #e4e4e4 100%)', boxShadow: '0 1px 3px rgba(60,40,20,.12), inset 0 1px 0 rgba(255,255,255,.6)' }}>
        <div style={{ position: 'absolute', inset: Math.max(3, px * 0.18), borderRadius: '50%', boxShadow: 'inset 0 0 0 1px #e4e4e4', pointerEvents: 'none' }} />
        <div style={{ position: 'absolute', inset: Math.max(3, px * 0.18) }}><PlateShape type={type} rimInset={0} chip={true} /></div>
      </div>
    </div>
  );
}

function PlatePicker({ value, onChange, displayFont = 'Fraunces, serif', accent = '#2a241c' }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!open) return;
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('pointerdown', h);
    return () => document.removeEventListener('pointerdown', h);
  }, [open]);
  const current = PLATE_TYPES.find(p => p.id === value) || PLATE_TYPES[0];
  return (
    <div ref={ref} style={{ position: 'relative' }}>
      <button onClick={() => setOpen(o => !o)} style={{ display: 'flex', alignItems: 'center', gap: 8, border: '1.5px solid #e4dcc8', background: '#fbf6ea', padding: '6px 14px 6px 8px', borderRadius: 899, cursor: 'pointer', boxShadow: '0 1px 2px rgba(60,40,20,.04)' }}>
        <PlateChip type={current.id} size={28} />
        <span style={{ fontFamily: displayFont, fontSize: 28, fontWeight: 500, letterSpacing: -.3, color: '#2a241c' }}>Plates</span>
      </button>
      {open && (
        <div style={{ position: 'absolute', top: 'calc(100% + 8px)', left: 0, zIndex: 40, background: '#fbf6ea', border: '1px solid #e4dcc8', borderRadius: 16, padding: 10, display: 'grid', gridTemplateColumns: 'repeat(5, 110px)', gap: 6, boxShadow: '0 12px 40px rgba(60,40,20,.12), 0 2px 8px rgba(60,40,20,.06)' }}>
          {PLATE_TYPES.map(pt => {
            const selected = pt.id === value;
            return (
              <button key={pt.id} onClick={() => { onChange(pt.id); setOpen(false); }} style={{ border: selected ? `1.5px solid ${accent}` : '1.5px solid transparent', background: selected ? '#fff' : 'transparent', borderRadius: 12, padding: '12px 8px 10px', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, transition: 'background .15s, border-color .15s' }} onMouseEnter={(e) => { if (!selected) e.currentTarget.style.background = 'rgba(255,255,255,.5)'; }} onMouseLeave={(e) => { if (!selected) e.currentTarget.style.background = 'transparent'; }}>
                <PlateChip type={pt.id} size={56} />
                <div style={{ fontFamily: displayFont, fontSize: 15, fontWeight: 500, color: '#2a241c', letterSpacing: -.1 }}>{pt.label}</div>
                <div style={{ fontFamily: 'Nunito, system-ui', fontSize: 11, color: '#8a7c66', lineHeight: 1.2, textAlign: 'center' }}>{pt.caption}</div>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}
Object.assign(window, { PLATE_TYPES, PlateShape, PlatePicker, PlateChip });

  <script type="text/babel">
const CHILD_COLORS = {
  cream: '#EDEADF', paper: '#F5F3ED', ink: '#2a241c', muted: '#8a7c66',
  line: '#D8D4C8', sage: '#A9D18E', sageDeep: '#6B9E52',
  plate: '#ffffff', plateRim: '#e4e4e4', plateShadow: 'rgba(0,0,0,.10)',
};

function Plate({ size = 420, items, onRemove, onMove, active, plateType = 'basic', itemSize = 149, outerRef }) {
  const localRef = React.useRef(null);
  const plateRef = outerRef || localRef;
  const visualSize = plateType === 'snack' ? size * 0.72 : size;
  const [jiggling, setJiggling] = React.useState(false);
  const onItemPointerDown = (e, item) => {
    e.stopPropagation();
    if (jiggling) { onRemove && onRemove(item.uid); return; }
    const el = e.currentTarget;
    const plate = plateRef.current;
    if (!plate) return;
    el.setPointerCapture(e.pointerId);
    const r0 = plate.getBoundingClientRect();
    const grabX = (e.clientX - r0.left) / r0.width * 100 - item.x;
    const grabY = (e.clientY - r0.top) / r0.height * 100 - item.y;
    const start = { x: e.clientX, y: e.clientY };
    let moved = false;
    let rafId = null;
    const longPress = setTimeout(() => { if (!moved) setJiggling(true); }, 500);
    const move = (ev) => {
      const dx = ev.clientX - start.x, dy = ev.clientY - start.y;
      if (!moved && Math.hypot(dx, dy) > 4) { moved = true; clearTimeout(longPress); }
      if (!moved || rafId) return;
      rafId = requestAnimationFrame(() => {
        rafId = null;
        const r = plate.getBoundingClientRect();
        const nx_raw = (ev.clientX - r.left) / r.width * 100 - grabX;
        const ny_raw = (ev.clientY - r.top) / r.height * 100 - grabY;
        const ddx = nx_raw - 50, ddy = ny_raw - 50;
        const dist = Math.hypot(ddx, ddy);
        let nx = nx_raw, ny = ny_raw;
        if (dist > 47) {
          el.dataset.willRemove = '1';
          nx = 50 + Math.cos(Math.atan2(ddy, ddx)) * 47;
          ny = 50 + Math.sin(Math.atan2(ddy, ddx)) * 47;
        } else { delete el.dataset.willRemove; }
        onMove && onMove(item.uid, nx, ny);
      });
    };
    const up = () => {
      clearTimeout(longPress);
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', up);
      if (!moved) { onRemove && onRemove(item.uid); return; }
      if (el.dataset.willRemove) { delete el.dataset.willRemove; onRemove && onRemove(item.uid); }
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  };
  return (
    <div ref={plateRef} onClick={() => { if (jiggling) setJiggling(false); }} style={{ position: 'relative', width: visualSize, height: visualSize, borderRadius: '50%', background: `radial-gradient(circle at 35% 30%, #fff 0%, ${CHILD_COLORS.plate} 55%, ${CHILD_COLORS.plateRim} 100%)`, boxShadow: active ? `0 12px 48px ${CHILD_COLORS.plateShadow}, 0 0 0 4px ${CHILD_COLORS.sage}33, inset 0 2px 0 rgba(255,255,255,.6), inset 0 -6px 0 rgba(60,40,20,.05)` : `0 10px 40px ${CHILD_COLORS.plateShadow}, inset 0 2px 0 rgba(255,255,255,.6), inset 0 -6px 0 rgba(60,40,20,.05)`, transition: 'box-shadow .25s, width .25s, height .25s' }}>
      <div style={{ position: 'absolute', inset: 18, borderRadius: '50%', boxShadow: `inset 0 0 0 1px ${CHILD_COLORS.plateRim}, inset 0 0 0 2px rgba(255,255,255,.4)`, pointerEvents: 'none' }} />
      <PlateShape type={plateType} plateColor={CHILD_COLORS.plate} rimColor={CHILD_COLORS.plateRim} />
      {items.map((it, i) => (
        <div key={it.uid} onPointerDown={(e) => onItemPointerDown(e, it)} style={{ position: 'absolute', left: `${it.x}%`, top: `${it.y}%`, transform: 'translate(-50%, -50%)', cursor: jiggling ? 'pointer' : 'grab', touchAction: 'none', userSelect: 'none', animation: jiggling ? `ppJiggle .35s ease-in-out ${i * 0.07}s infinite alternate` : 'ppPlacedIn .32s cubic-bezier(.2,.8,.3,1.1)' }}>
          <FoodImage id={it.id} size={itemSize} />
        </div>

function PlateyReaction({ count }) {
  const prev = React.useRef(0);
  const [phase, setPhase] = React.useState('idle');
  React.useEffect(() => {
    const was = prev.current;
    prev.current = count;
    if (count === 0) { setPhase('idle'); return; }
    if (was === 0 && count === 1) {
      setPhase('belly');
      const t = setTimeout(() => setPhase('watching'), 2600);
      return () => clearTimeout(t);
    }
    if (count >= 3 && was < 3) {
      setPhase('excited');
      const t = setTimeout(() => setPhase('watching'), 1600);
      return () => clearTimeout(t);
    }
    setPhase(p => p === 'belly' || p === 'excited' ? p : 'watching');
  }, [count]);
  const src = phase === 'excited' ? './platey_celebration_transparent.png' : './platey_home_transparent.png';
  const anim = { idle: 'ppWelcomeWave 2.4s ease-in-out infinite', belly: 'ppBellyRub .7s ease-in-out infinite', watching: 'ppPlateyWatch 2.2s ease-in-out infinite', excited: 'ppPlateyBounce .6s cubic-bezier(.2,.8,.3,1.2) both' }[phase];
  return (
    <div style={{ position: 'absolute', bottom: 24, left: 36, pointerEvents: 'none', zIndex: 5 }}>
      <img src={src} width={120} style={{ display: 'block', transformOrigin: '50% 75%', animation: anim }} />
    </div>
  );
}

  const onDragStart = (e, id) => {
    e.dataTransfer.setData('text/food', id);
    const foodCircle = e.currentTarget.querySelector('img')?.parentElement;
    if (foodCircle) {
      const size = foodCircle.offsetWidth;

      Object.assign(ghost.style, {

        width: size + 'px', height: size + 'px',

    }
    setDraggingId(id);
    setDragActive(true);
  };
  const onDragOver = (e) => e.preventDefault();
  const onDrop = (e) => {
    if (isTouchDragRef.current) return;

    const id = e.dataTransfer.getData('text/food') || draggingId;

      }
    };

      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }

      if (!g) return;
      ghostRef.current = null;
      if (animate) {
        g.style.transition = 'transform .18s ease-in, opacity .18s ease-in';

        { value: 'chewy',   label: 'Chewy'   }, { value: 'smooth', label: 'Smooth' },
        { value: 'fluffy',  label: 'Fluffy'  }, { value: 'juicy',  label: 'Juicy'  },
        { value: 'firm',    label: 'Firm'    }, { value: 'sticky', label: 'Sticky' },
      ]} />
      <Row active={tempFilter} onSelect={setTempFilter} options={[
        { value: 'hot',    label: 'Hot'      }, { value: 'cold',   label: 'Cold'   },
        { value: 'room',   label: 'Room Temp' }, { value: 'frozen', label: 'Frozen' },
      ]} />
      <Row active={typeFilter} onSelect={setTypeFilter} options={[
        { value: 'fruit',   label: 'Fruit'   }, { value: 'veggies', label: 'Veggies' },
        { value: 'protein', label: 'Protein' }, { value: 'dairy',   label: 'Dairy'   },
        { value: 'grains',  label: 'Grains'  }, { value: 'treats',  label: 'Sweets & Snacks'  },
      ]} />
      {hasAny && (
        <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: -2, paddingBottom: 6 }}>
          <button onClick={() => { setTextureFilter(null); setTempFilter(null); setTypeFilter(null); }}
            style={{ border: 'none', background: 'transparent', fontFamily: careFont, fontSize: 11, fontWeight: 600, color: CARE_COLORS.muted, cursor: 'pointer', padding: 0, textDecoration: 'underline' }}>
            Clear filters
          </button>
        </div>
      )}
    </div>
  );
}

function CareToday({ childName = '', savedMenus = [], kitchenIds = [], menu = [], onSetMenu, onSaved, onSendMenu, onSaveMenu, onOpenPantry, pickedPlate, onViewActivity, openKitchen, onKitchenOpened, onNewMenu }) {
  const [meal, setMeal] = React.useState('lunch');

  const [saved, setSaved] = React.useState(false);

  const [pickingPlate, setPickingPlate] = React.useState(false);
  const [pendingMeal, setPendingMeal] = React.useState(null);
  const [kitchenQuery, setKitchenQuery] = React.useState('');
  const [closedKitchenCats, setClosedKitchenCats] = React.useState(new Set());
  const [textureFilter, setTextureFilter] = React.useState(null);
  const [tempFilter, setTempFilter] = React.useState(null);
  const [typeFilter, setTypeFilter] = React.useState(null);
  const [saveName, setSaveName] = React.useState('');
  const [menuSaved, setMenuSaved] = React.useState(false);

  const lastSentMenuRef = React.useRef(null);
  const [menuFull, setMenuFull] = React.useState(false);

    if (saved && lastSentMenuRef.current && JSON.stringify(menu) !== JSON.stringify(lastSentMenuRef.current)) {
      setSaved(false);
    }
  }, [menu]);
  const handleSaveMenu = () => {
    if (!saveName.trim()) return;
    onSaveMenu && onSaveMenu({ name: saveName.trim(), meal, ids: menu, childIds: [], timestamp: new Date().toISOString() });
    setSaveName(''); setMenuSaved(true);
  };
  const meals = [
    { id: 'breakfast', label: 'Breakfast' }, { id: 'lunch', label: 'Lunch' },
    { id: 'dinner', label: 'Dinner' },       { id: 'snack', label: 'Snack' },
  ];
  const toggleFood = (id) => onSetMenu(xs => {
    if (xs.includes(id)) return xs.filter(x => x !== id);
    if (xs.length >= MENU_LIMIT) { setMenuFull(true); setTimeout(() => setMenuFull(false), 2500); return xs; }
    return [...xs, id];
  });
  const mealLabel = meals.find(m => m.id === meal)?.label || 'Lunch';
  const handleSave = () => { lastSentMenuRef.current = [...menu]; setSaved(true); setMenuSaved(false); setNudgeDismissed(false); onSendMenu && onSendMenu({ items: menu, plateType, mealLabel }); };
  const switchMeal = (m) => {
    if (m.id === meal) return;
    if (menu.length > 0) { setPendingMeal(m); return; }
    setMeal(m.id); onSetMenu([]); setSaved(false); setPlateStatusDismissed(true);
    if (m.id === 'snack') setPlateType('snack');
  };
  const confirmSwitch = () => {
    setMeal(pendingMeal.id); onSetMenu([]); setSaved(false); setPlateStatusDismissed(true);
    if (pendingMeal.id === 'snack') setPlateType('snack');
    setPendingMeal(null);
  };

  // Build kitchen categories from live kitchenIds prop
  const knownIds = new Set(KITCHEN.flatMap(c => c.ids));
  const extraIds = kitchenIds.filter(id => !knownIds.has(id) && FOOD_CATALOG[id]);
  const kitchenCats = [
    ...(extraIds.length > 0 ? [{ label: 'Recently Added', ids: extraIds }] : []),
    ...KITCHEN.map(cat => ({ label: cat.label, ids: cat.ids.filter(id => kitchenIds.includes(id) && FOOD_CATALOG[id]) })),
  ].filter(cat => cat.ids.length > 0);

  const _now = new Date();
  const _days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const _months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const dateLabel = `${_days[_now.getDay()]} · ${_now.getDate()} ${_months[_now.getMonth()]}`;

  return (
    <div style={{ position: 'relative', height: '100%', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      <style>{`@keyframes sheetUp { from { transform: translateY(100%) } to { transform: translateY(0) } } @keyframes ppFadeSlideUp { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } } @keyframes ppButtonBounce { 0%{transform:scale(1)} 30%{transform:scale(1.05)} 55%{transform:scale(.97)} 75%{transform:scale(1.02)} 100%{transform:scale(1)} } @keyframes ppPulse { 0%,100%{opacity:.5;transform:scale(.8)} 50%{opacity:1;transform:scale(1)} }`}</style>
      <CareStatusBar />
      <div style={{ flex: 1, overflow: 'auto', padding: '8px 20px 120px', fontFamily: careFont }}>
        <div style={{ marginTop: 8 }}>
          <div style={{ fontSize: 12, color: CARE_COLORS.muted, fontWeight: 600, letterSpacing: .6, textTransform: 'uppercase' }}>{dateLabel}</div>
          <div style={{ marginTop: 4 }}>
            <div style={{ fontFamily: serifFont, fontSize: 32, fontWeight: 500, letterSpacing: -.5, color: CARE_COLORS.ink, lineHeight: 1.1 }}>{childName ? `${childName}'s Menu` : "Today's Menu"}</div>

        </div>
        <div style={{ background: '#fff', borderRadius: 16, padding: 12, border: `1px solid ${CARE_COLORS.lineSoft}`, display: 'flex', flexWrap: 'wrap', gap: 8, minHeight: 56, marginTop: 14 }}>
          {menu.length === 0 && (
            <div style={{ width: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '12px 0 4px', gap: 4 }}>
              <PlateHero size={72} />

            </div>

          {menuFull && (
            <div style={{ width: '100%', padding: '8px 12px', background: '#fef3cd', border: '1px solid #e8c040', borderRadius: 8, fontFamily: careFont, fontSize: 13, fontWeight: 600, color: '#7a5a10', textAlign: 'center', animation: 'ppFadeSlideUp .18s ease' }}>

        {/* Loop status strip: Sent → Waiting → Received */}
        {saved && (
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 14, padding: '9px 12px', background: pickedPlate && !plateStatusDismissed ? '#EEF7E4' : CARE_COLORS.sageSoft, borderRadius: 10, border: `1px solid ${pickedPlate && !plateStatusDismissed ? '#C3E09A' : CARE_COLORS.sage}` }}>
            {pickedPlate ? (
              <>
                <svg width="15" height="15" viewBox="0 0 15 15" fill="none" style={{ flexShrink: 0 }}>
                  <circle cx="7.5" cy="7.5" r="7.5" fill="#6AAF3D" opacity=".2" />
                  <path d="M4 7.5l2.5 2.5 4.5-4.5" stroke="#3A7D0E" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
                </svg>
                <span style={{ flex: 1, fontFamily: careFont, fontSize: 13, fontWeight: 600, color: CARE_COLORS.sageDeep }}>{childName || 'Your child'} picked their plate</span>
                <button onClick={onViewActivity} style={{ border: 'none', background: 'none', fontFamily: careFont, fontSize: 13, fontWeight: 700, color: CARE_COLORS.sageDeep, cursor: 'pointer', padding: 0 }}>View →</button>
              </>
            ) : (
              <>
                <div style={{ width: 7, height: 7, borderRadius: '50%', background: CARE_COLORS.sageDeep, flexShrink: 0, animation: 'ppPulse 1.6s ease-in-out infinite' }} />
                <span style={{ fontFamily: careFont, fontSize: 13, fontWeight: 600, color: CARE_COLORS.sageDeep }}>Sent · Waiting for {childName || 'your child'} to pick</span>
              </>
            )}
          </div>
        )}
        {menu.length > 0 && (
          <div style={{ marginTop: 12 }}>
            <button onClick={handleSave} style={{ width: '100%', border: 'none', padding: '16px', borderRadius: 12, background: saved ? '#8BBF6A' : CARE_COLORS.sageDeep, color: '#fbf6ea', fontFamily: careFont, fontSize: 16, fontWeight: 600, cursor: 'pointer', boxShadow: '0 4px 14px rgba(40,80,40,.15)', transition: 'background .2s', animation: saved ? 'ppButtonBounce .5s cubic-bezier(.2,.8,.3,1.2)' : 'none', touchAction: 'manipulation' }}>
              {saved ? `✓ Menu sent` : `Send ${childName ? `${childName}'s ` : ''}Menu`}
            </button>
          </div>
        )}
        {saved && !menuSaved && !nudgeDismissed && (
          <div style={{ marginTop: 10, background: '#fff', borderRadius: 12, padding: '14px', border: `1px solid ${CARE_COLORS.line}`, animation: 'ppFadeSlideUp .18s ease' }}>
            <div style={{ fontFamily: careFont, fontSize: 13, fontWeight: 600, color: CARE_COLORS.ink, marginBottom: 10 }}>Save this menu for next time?</div>
            <div style={{ display: 'flex', gap: 8 }}>
              <input value={saveName} onChange={e => setSaveName(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSaveMenu()}
                placeholder='e.g. "Easy weeknight"'
                style={{ flex: 1, border: `1px solid ${CARE_COLORS.line}`, borderRadius: 8, padding: '9px 12px', fontFamily: careFont, fontSize: 14, color: CARE_COLORS.ink, outline: 'none', background: CARE_COLORS.bg }} />
              <button onClick={handleSaveMenu} disabled={!saveName.trim()}
                style={{ border: 'none', background: saveName.trim() ? CARE_COLORS.sageDeep : CARE_COLORS.lineSoft, color: saveName.trim() ? '#fbf6ea' : CARE_COLORS.muted, borderRadius: 8, padding: '9px 18px', fontFamily: careFont, fontSize: 14, fontWeight: 700, cursor: saveName.trim() ? 'pointer' : 'default', transition: 'background .15s' }}>
                Save
              </button>
            </div>
            <div onClick={() => setNudgeDismissed(true)} style={{ marginTop: 8, textAlign: 'center', fontSize: 12, color: CARE_COLORS.muted, fontWeight: 500, cursor: 'pointer', fontFamily: careFont }}>Not this time</div>
          </div>
        )}
        {saved && menuSaved && (
          <div style={{ marginTop: 10, padding: '11px 14px', background: CARE_COLORS.sageSoft, borderRadius: 12, border: `1px solid ${CARE_COLORS.sage}`, fontFamily: careFont, fontSize: 13, fontWeight: 600, color: CARE_COLORS.sageDeep }}>

              </div>
            )}
            {savedMenus.map(m => {
              const d = new Date(m.id);
              const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
              const dateStr = `${months[d.getMonth()]} ${d.getDate()}`;
              return (
              <div key={m.id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '13px 14px', background: '#fff', borderRadius: 12, border: `1px solid ${CARE_COLORS.lineSoft}` }}>
                <div>
                  <div style={{ fontSize: 15, fontWeight: 600, color: CARE_COLORS.ink }}>{m.name}</div>
                  <div style={{ fontSize: 12, color: CARE_COLORS.muted, marginTop: 2 }}>{dateStr} · {m.ids.length} items</div>

                <button onClick={() => { onSetMenu(m.ids); setMenuSaved(false); setSaved(false); }} style={{ border: `1.5px solid ${CARE_COLORS.sage}`, background: 'transparent', color: CARE_COLORS.sageDeep, padding: '7px 14px', borderRadius: 899, fontFamily: careFont, fontSize: 13, fontWeight: 600, cursor: 'pointer', flexShrink: 0 }}>Use</button>

      {kitchenOpen && (
        <div onClick={() => { setKitchenOpen(false); setKitchenQuery(''); }} style={{ position: 'absolute', inset: 0, zIndex: 40, background: 'rgba(40,30,20,.25)', display: 'flex', alignItems: 'flex-end' }}>
          <div onClick={e => e.stopPropagation()} style={{ width: '100%', maxHeight: '82%', background: CARE_COLORS.bg, borderRadius: '20px 20px 0 0', display: 'flex', flexDirection: 'column', animation: 'sheetUp .25s cubic-bezier(.2,.8,.3,1)', position: 'relative' }}>
            {menuFull && (
              <div style={{ position: 'absolute', top: 16, left: 16, right: 16, zIndex: 10, background: '#1a1612', color: '#fff', borderRadius: 12, padding: '11px 16px', fontFamily: careFont, fontSize: 14, fontWeight: 600, textAlign: 'center', boxShadow: '0 4px 16px rgba(0,0,0,.25)', animation: 'ppFadeSlideUp .22s ease', pointerEvents: 'none' }}>

              </div>

            <div style={{ padding: '14px 20px 0', flexShrink: 0 }}>
              <div style={{ width: 36, height: 4, borderRadius: 2, background: CARE_COLORS.line, margin: '0 auto 16px' }} />

                <div style={{ fontFamily: serifFont, fontSize: 22, fontWeight: 500, color: CARE_COLORS.ink }}>Kitchen</div>
                <div onClick={() => { setKitchenOpen(false); setKitchenQuery(''); onOpenPantry && onOpenPantry(); }} style={{ fontSize: 13, fontWeight: 600, color: CARE_COLORS.sageDeep, cursor: 'pointer', fontFamily: careFont }}>Add to Kitchen</div>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, background: '#fff', border: `1px solid ${CARE_COLORS.line}`, borderRadius: 10, padding: '9px 12px', marginBottom: 14 }}>
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style={{ flexShrink: 0 }}><circle cx="6" cy="6" r="4.5" stroke={CARE_COLORS.muted} strokeWidth="1.5"/><line x1="9.5" y1="9.5" x2="12.5" y2="12.5" stroke={CARE_COLORS.muted} strokeWidth="1.5" strokeLinecap="round"/></svg>
                <input value={kitchenQuery} onChange={e => setKitchenQuery(e.target.value)} placeholder="Search kitchen…" style={{ flex: 1, border: 'none', outline: 'none', background: 'transparent', fontFamily: careFont, fontSize: 14, color: CARE_COLORS.ink }} />
                {kitchenQuery && <div onClick={() => setKitchenQuery('')} style={{ color: CARE_COLORS.muted, cursor: 'pointer', fontSize: 16, lineHeight: 1, marginTop: -1 }}>×</div>}

            </div>
            <div style={{ flex: 1, overflow: 'auto', padding: '0 20px 32px' }}>
              {(() => {
                const q = kitchenQuery.trim().toLowerCase();

                const filterIds = (ids) => ids.filter(id => {
                  if (q && !FOOD_CATALOG[id]?.name.toLowerCase().includes(q)) return false;
                  const meta = FOOD_META[id];
                  if (meta) {
                    if (textureFilter && !meta.textures.includes(textureFilter)) return false;
                    if (tempFilter && !meta.temps.includes(tempFilter)) return false;
                    if (typeFilter && meta.type !== typeFilter) return false;
                  }
                  return true;
                });
                const cats = kitchenCats.map(cat => ({ ...cat, ids: filterIds(cat.ids) })).filter(cat => cat.ids.length > 0);
                if (hasFilter && cats.length === 0) return <div style={{ fontFamily: careFont, fontSize: 14, color: CARE_COLORS.muted, textAlign: 'center', marginTop: 32 }}>No results found</div>;
                return cats.map(cat => {
                  const isOpen = !closedKitchenCats.has(cat.label);
                  const toggleCat = () => setClosedKitchenCats(s => { const n = new Set(s); isOpen ? n.add(cat.label) : n.delete(cat.label); return n; });
                  return (
                  <div key={cat.label} style={{ marginBottom: 8, background: '#fff', borderRadius: 14, border: `1px solid ${CARE_COLORS.lineSoft}`, overflow: 'hidden' }}>
                    <div onClick={toggleCat} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '12px 14px', cursor: 'pointer' }}>
                      <div style={{ fontSize: 12, fontWeight: 700, color: CARE_COLORS.ink, fontFamily: careFont }}>{cat.label}</div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <span style={{ fontSize: 11, color: CARE_COLORS.muted, fontFamily: careFont }}>{cat.ids.length}</span>
                        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke={CARE_COLORS.muted} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ transition: 'transform .2s', transform: isOpen ? 'rotate(0deg)' : 'rotate(-90deg)', flexShrink: 0 }}><path d="M2 4l4 4 4-4"/></svg>
                      </div>
                    </div>
                    {isOpen && (
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8, padding: '0 12px 12px' }}>
                        {cat.ids.map(id => {
                          const onMenu = menu.includes(id);
                          return (
                            <div key={id} onClick={() => toggleFood(id)} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, padding: '12px 6px 10px', borderRadius: 12, background: onMenu ? '#E4F3DC' : CARE_COLORS.bg, border: onMenu ? `1.5px solid #A9D18E` : `1px solid ${CARE_COLORS.lineSoft}`, cursor: 'pointer', position: 'relative', transition: 'background .15s, border-color .15s' }}>
                              <FoodImage id={id} size={52} />
                              <div style={{ fontSize: 12, fontWeight: 600, color: CARE_COLORS.ink, textAlign: 'center', lineHeight: 1.2, fontFamily: careFont }}>{FOOD_CATALOG[id].name}</div>
                              {onMenu && (
                                <div style={{ position: 'absolute', top: 6, right: 6, width: 16, height: 16, borderRadius: '50%', background: '#6B9E52', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                  <svg width="8" height="8" viewBox="0 0 8 8" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M1.5 4l1.8 1.8L6.5 2"/></svg>
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );});
              })()}
            </div>
            <div style={{ padding: '12px 20px 24px', flexShrink: 0 }}>
              <button onClick={() => { setKitchenOpen(false); setKitchenQuery(''); }} style={{ width: '100%', padding: '13px 0', borderRadius: 12, background: CARE_COLORS.sageDeep, border: 'none', color: '#fbf6ea', fontSize: 15, fontWeight: 600, fontFamily: careFont, cursor: 'pointer', boxShadow: '0 4px 14px rgba(40,80,40,.15)' }}>
                {menu.length > 0 ? `Add to Menu · ${menu.length} / ${MENU_LIMIT}` : 'Add to Menu'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function CareNotification({ childName = '', pickedPlate, onSaveMenu, sentMealLabel = 'Lunch', sentMenuItems = [], savedMenus = [] }) {
  const [saved, setSaved] = React.useState(false);
  const [naming, setNaming] = React.useState(false);
  const [menuName, setMenuName] = React.useState('');
  const NAME_LIMIT = 30;

  const pickedFoodIds = pickedPlate ? [...new Set(pickedPlate.items.map(it => it.id))] : [];
  const [firstTries, setFirstTries] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('pyp_child_first_tries') || '[]'); } catch { return []; }
  });
  React.useEffect(() => {
    if (!pickedPlate || pickedFoodIds.length === 0) return;
    const knownIds = new Set(firstTries.map(e => e.foodId));
    const additions = pickedFoodIds.filter(id => !knownIds.has(id)).map(id => ({ foodId: id, timestamp: pickedPlate.submittedAt || Date.now() }));
    if (!additions.length) return;
    const updated = [...firstTries, ...additions];
    localStorage.setItem('pyp_child_first_tries', JSON.stringify(updated));
    setFirstTries(updated);
  }, [pickedPlate]);

  if (!pickedPlate) {
    return (
      <div style={{ position: 'relative', height: '100%', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
        <CareStatusBar />
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 12, padding: '0 40px', textAlign: 'center' }}>
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke={CARE_COLORS.line} strokeWidth="2" strokeLinecap="round"><circle cx="20" cy="20" r="15"/><path d="M20 13v7l4 4"/></svg>
          <div style={{ fontFamily: serifFont, fontSize: 22, fontWeight: 500, letterSpacing: -.3, color: CARE_COLORS.muted, lineHeight: 1.3 }}>Waiting for {childName || 'your child'} to pick their plate.</div>
          <div style={{ fontFamily: careFont, fontSize: 14, color: CARE_COLORS.muted, lineHeight: 1.5 }}>This is where you'll be able to track your child's choices.</div>
        </div>
      </div>
    );
  }

  const items        = pickedPlate.items;
  const plateType    = pickedPlate.plateType || 'basic';
  const foodIds      = sentMenuItems.length > 0 ? [...new Set(sentMenuItems)] : pickedFoodIds;
  const plateLabel = { basic: 'Basic round plate', divided: 'Divided plate', rainbow: 'Rainbow plate', 'one-new-thing': 'One new thing', snack: 'Snack plate' }[plateType] || 'Round plate';
  const timeLabel = pickedPlate.submittedAt
    ? new Date(pickedPlate.submittedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
    : null;

  const historicalFoods = new Set(savedMenus.flatMap(m => m.ids));
  const familiarFoods = pickedFoodIds.filter(id => historicalFoods.has(id));
  const newFoods = pickedFoodIds.filter(id => !historicalFoods.has(id));
  const nameList = ids => { const ns = ids.map(id => FOOD_CATALOG[id]?.name).filter(Boolean); return ns.length <= 2 ? ns.join(' and ') : ns.slice(0,-1).join(', ') + ' and ' + ns.slice(-1); };

  const relativeTime = ts => {
    const days = Math.floor((Date.now() - ts) / 86400000);
    if (days === 0) return 'today';
    if (days === 1) return 'yesterday';
    if (days < 7) return `${days} days ago`;
    const weeks = Math.floor(days / 7);
    return weeks === 1 ? 'one week ago' : `${weeks} weeks ago`;
  };
  const thisWeekCount = firstTries.filter(e => Date.now() - e.timestamp < 7 * 86400000).length;
  const mostRecentEntry = firstTries.length ? firstTries.reduce((a, b) => a.timestamp > b.timestamp ? a : b) : null;

  let headline, subline, insightTag;
  if (savedMenus.length === 0) {
    headline = `${childName || 'Your child'} built their first plate.`;
    subline = `${pickedFoodIds.length} ${pickedFoodIds.length === 1 ? 'food' : 'foods'} chosen.`;
    insightTag = 'First plate';
  } else if (newFoods.length > 0 && familiarFoods.length > 0) {
    headline = `${familiarFoods.length} familiar, ${newFoods.length} new.`;
    subline = `First time with ${nameList(newFoods)}.`;
    insightTag = newFoods.length === 1 ? '1 new food' : `${newFoods.length} new foods`;
  } else if (newFoods.length > 0) {
    headline = `${newFoods.length === 1 ? 'One new food' : `${newFoods.length} new foods`} today.`;
    subline = `First time with ${nameList(newFoods)}.`;
    insightTag = newFoods.length === 1 ? '1 new food' : `${newFoods.length} new foods`;
  } else {
    headline = `${childName || 'Your child'} chose familiar foods today.`;
    subline = `${familiarFoods.length} ${familiarFoods.length === 1 ? 'food' : 'foods'} from their usual picks.`;
    insightTag = null;
  }

  return (
    <div style={{ position: 'relative', height: '100%', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      <CareStatusBar />
      <div style={{ flex: 1, overflow: 'auto', padding: '6px 20px 120px', fontFamily: careFont }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginTop: 12 }}>
          <PlateHero size={80} />
          <div>
            <div style={{ fontFamily: serifFont, fontSize: 26, fontWeight: 500, letterSpacing: -.4, color: CARE_COLORS.ink, lineHeight: 1.15 }}>{headline}</div>
            <div style={{ fontSize: 14, color: CARE_COLORS.muted, marginTop: 4 }}>{subline}</div>
            {timeLabel && <div style={{ fontSize: 12, color: CARE_COLORS.muted, marginTop: 5, fontFamily: careFont }}>Submitted at {timeLabel}</div>}
          </div>
        </div>
        <div style={{ marginTop: 22, padding: 24, background: '#fff', borderRadius: 20, border: `1px solid ${CARE_COLORS.lineSoft}`, display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
          <div style={{ position: 'relative', width: 220, height: 220 }}>
            <div style={{ position: 'absolute', inset: 0, borderRadius: '50%', background: `radial-gradient(circle at 35% 30%, #fff, #ffffff 55%, #e4e4e4 100%)`, boxShadow: '0 6px 22px rgba(60,40,20,.1), inset 0 2px 0 rgba(255,255,255,.6)' }} />
            <PlateShape type={plateType} plateColor="#ffffff" rimColor="#e4e4e4" />
            {items.map(it => (
              <div key={it.uid} style={{ position: 'absolute', left: `${it.x}%`, top: `${it.y}%`, transform: 'translate(-50%, -50%)' }}>
                <FoodImage id={it.id} size={72} />
              </div>
            ))}
          </div>
          <div style={{ fontSize: 12, color: CARE_COLORS.muted, fontWeight: 600, letterSpacing: .6, textTransform: 'uppercase', marginTop: 18 }}>{plateLabel}</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, justifyContent: 'center', marginTop: 10 }}>
            {pickedFoodIds.map(id => <span key={id} style={{ fontSize: 13, fontWeight: 600, color: CARE_COLORS.ink, padding: '4px 10px', borderRadius: 899, background: CARE_COLORS.surface }}>{FOOD_CATALOG[id]?.name}</span>)}
          </div>
        </div>
        <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10, padding: '12px 14px', background: CARE_COLORS.sageSoft, borderRadius: 12, marginTop: 4 }}>
          <img src="./platey_home_transparent.png" style={{ width: 36, height: 36, objectFit: 'contain', flexShrink: 0 }} />
          <p style={{ margin: 0, fontSize: 13, color: CARE_COLORS.sageDeep, lineHeight: 1.5, fontFamily: careFont, fontWeight: 500 }}>
            {newFoods.length > 0 && familiarFoods.length > 0
              ? "You've been offering a nice mix of familiar and new — that's exactly how comfort with food grows."
              : newFoods.length > 0
              ? "All new foods today — consider pairing with something familiar next time to keep it low-stress."
              : "Staying with familiar foods is totally valid. Consistency builds trust over time."}
          </p>
        </div>
        {pickedFoodIds.length > 0 && (() => {
          const allChildIds = [...pickedFoodIds, ...savedMenus.flatMap(m => m.childIds || [])];
          const total = allChildIds.length;
          const counts = {};
          allChildIds.forEach(id => { const meta = FOOD_META[id]; if (meta) meta.textures.forEach(t => { counts[t] = (counts[t]||0)+1; }); });
          const entries = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0,5);
          if (!entries.length) return null;
          return (
            <div style={{ marginTop: 8, padding: '14px 16px', background: '#fff', borderRadius: 14, border: `1px solid ${CARE_COLORS.lineSoft}` }}>
              <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: .8, textTransform: 'uppercase', color: CARE_COLORS.muted, marginBottom: 12, fontFamily: careFont }}>Texture patterns · child selections</div>
              {entries.map(([texture, count]) => (
                <div key={texture} style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
                  <div style={{ width: 68, fontSize: 12, fontWeight: 600, color: CARE_COLORS.ink, fontFamily: careFont, textTransform: 'capitalize', flexShrink: 0 }}>{texture}</div>
                  <div style={{ flex: 1, height: 6, background: CARE_COLORS.lineSoft, borderRadius: 3, overflow: 'hidden' }}>
                    <div style={{ width: `${Math.round((count/total)*100)}%`, height: '100%', background: CARE_COLORS.sageDeep, borderRadius: 3 }} />
                  </div>
                  <div style={{ width: 24, fontSize: 12, color: CARE_COLORS.muted, fontFamily: careFont, textAlign: 'right', flexShrink: 0 }}>{count}</div>
                </div>
              ))}
            </div>
          );
        })()}
        <div style={{ marginTop: 8, padding: '14px 16px', background: '#fff', borderRadius: 14, border: `1px solid ${CARE_COLORS.lineSoft}` }}>
          <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: .8, textTransform: 'uppercase', color: CARE_COLORS.muted, marginBottom: 10, fontFamily: careFont }}>First tries</div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 6 }}>
            <span style={{ fontSize: 28, fontWeight: 700, color: CARE_COLORS.ink, fontFamily: careFont, letterSpacing: -.5, lineHeight: 1 }}>{firstTries.length}</span>
            <span style={{ fontSize: 13, color: CARE_COLORS.muted, fontFamily: careFont }}>since {childName || 'they'} started</span>
          </div>
          {thisWeekCount > 0 && (
            <div style={{ fontSize: 12, color: CARE_COLORS.muted, fontFamily: careFont, marginTop: 4 }}>
              <span style={{ fontWeight: 600, color: CARE_COLORS.sageDeep }}>{thisWeekCount}</span> this week
            </div>
          )}
          {mostRecentEntry && FOOD_CATALOG[mostRecentEntry.foodId] && (
            <div style={{ fontSize: 12, color: CARE_COLORS.muted, fontFamily: careFont, marginTop: 8, paddingTop: 8, borderTop: `1px solid ${CARE_COLORS.lineSoft}` }}>
              Most recent: <span style={{ fontWeight: 600, color: CARE_COLORS.ink }}>{FOOD_CATALOG[mostRecentEntry.foodId].name}</span> · {relativeTime(mostRecentEntry.timestamp)}
            </div>
          )}
        </div>
        {saved ? (
          <div style={{ width: '100%', marginTop: 8, padding: '13px', borderRadius: 12, background: '#8BBF6A', color: '#fbf6ea', fontFamily: careFont, fontSize: 14, fontWeight: 600, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7 }}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 7l3.5 3.5L12 3"/></svg>Saved as "{menuName}"
          </div>
        ) : naming ? (
          <div style={{ marginTop: 8, background: '#fff', border: `1px solid ${CARE_COLORS.line}`, borderRadius: 12, padding: '14px 14px 12px', display: 'flex', flexDirection: 'column', gap: 10 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
              <span style={{ fontFamily: careFont, fontSize: 13, fontWeight: 600, color: CARE_COLORS.ink }}>Name this menu</span>
              <span style={{ fontFamily: careFont, fontSize: 12, color: menuName.length >= NAME_LIMIT ? '#e05' : CARE_COLORS.muted }}>{menuName.length}/{NAME_LIMIT}</span>
            </div>
            <input
              autoFocus
              value={menuName}
              onChange={e => setMenuName(e.target.value.slice(0, NAME_LIMIT))}
              onKeyDown={e => { if (e.key === 'Enter' && menuName.trim()) { setSaved(true); setNaming(false); onSaveMenu && onSaveMenu({ name: menuName.trim(), meal: sentMealLabel, ids: foodIds, childIds: pickedFoodIds }); } if (e.key === 'Escape') setNaming(false); }}
              placeholder={`${childName ? `${childName}'s ` : ''}${sentMealLabel}`}
              style={{ border: `1px solid ${CARE_COLORS.line}`, borderRadius: 8, padding: '10px 12px', fontFamily: careFont, fontSize: 14, color: CARE_COLORS.ink, outline: 'none', width: '100%', boxSizing: 'border-box' }}
            />
            <div style={{ display: 'flex', gap: 8 }}>
              <button onClick={() => setNaming(false)} style={{ flex: 1, border: `1px solid ${CARE_COLORS.line}`, padding: '10px', borderRadius: 10, background: 'none', fontFamily: careFont, fontSize: 13, fontWeight: 600, color: CARE_COLORS.muted, cursor: 'pointer' }}>Cancel</button>
              <button onClick={() => { const n = menuName.trim() || `${childName ? `${childName}'s ` : ''}${sentMealLabel}`; setMenuName(n); setSaved(true); setNaming(false); onSaveMenu && onSaveMenu({ name: n, meal: sentMealLabel, ids: foodIds, childIds: pickedFoodIds }); }} style={{ flex: 2, border: 'none', padding: '10px', borderRadius: 10, background: CARE_COLORS.sageDeep, fontFamily: careFont, fontSize: 13, fontWeight: 600, color: '#fbf6ea', cursor: 'pointer' }}>Save</button>
            </div>
          </div>
        ) : null}
      </div>
    </div>
  );
}

  { label: 'Vegetables',      ids: ['carrot', 'cucumber', 'broccoli', 'spinach', 'lettuce', 'peas', 'snappeas', 'tomato', 'sweetpotato', 'pepper', 'celery', 'cauliflower', 'edamame', 'avocado', 'hashbrowns', 'coleslaw', 'guacamole', 'corn', 'salad', 'onionrings'] },
  { label: 'Fruit',           ids: ['apple', 'applesauce', 'grapes', 'orange', 'banana', 'strawberry', 'raspberries', 'berries', 'watermelon', 'peach', 'mango', 'pear', 'cherry', 'kiwi', 'pineapple', 'cantaloupe', 'honeydew', 'mandarin'] },
  { label: 'Grains & Starch', ids: ['pasta', 'rice', 'fries', 'crackers', 'potato', 'toast', 'cereal', 'bread', 'wrap', 'oatmeal', 'noodles', 'waffle', 'pancake', 'bagel', 'cinnamontoast', 'roll', 'spaghettios', 'grahams', 'mashedpotato', 'frenchtoast', 'tatertots', 'garlicbread', 'naan'] },
  { label: "Kid's Favorites", ids: ['mac', 'pizza', 'grilledcheese', 'quesadilla', 'pbj', 'friedrice', 'spagmeatballs', 'chickennoodlesoup', 'eggsandwich', 'chickenrice', 'turkeysandwich', 'hamsandwich', 'lasagna', 'ramen', 'eggroll', 'tacos', 'burrito', 'samosa'] },
  { label: 'Dairy & Other',   ids: ['milk', 'yogurt', 'cheese', 'raisins', 'cottage', 'stringcheese', 'popcorn', 'pretzel', 'granola', 'greekyogurt', 'icecream', 'applejuice', 'oj', 'creamcheese', 'nutella', 'pumpkinseeds', 'caprisun', 'hotchocolate', 'chocolatemilk', 'milkshake', 'soda'] },
  { label: 'Sweets & Snacks', ids: ['cookie', 'donut', 'goldfish', 'tortillachips', 'chips', 'fruitsnack', 'popsicle', 'nachos', 'poptart', 'jello', 'marshmallows', 'applepie', 'smores', 'oreo', 'cake'] },
];

function CareLibrary({ childName = '', savedMenus = [], kitchenIds = [], onAddToKitchen, onAddToMenu, onDone }) {
  const [kitchenFoods, setKitchenFoods] = React.useState(() => [...kitchenIds]);
  const [query, setQuery] = React.useState('');
  const [openStoreCats, setOpenStoreCats] = React.useState(() => new Set(CATALOG_CATS.map(c => c.label)));
  const [textureFilter, setTextureFilter] = React.useState(null);
  const [tempFilter, setTempFilter] = React.useState(null);
  const [typeFilter, setTypeFilter] = React.useState(null);
  const toggle = (id) => setKitchenFoods(xs => xs.includes(id) ? xs.filter(x => x !== id) : [...xs, id]);
  const newlyAdded = kitchenFoods.filter(id => !kitchenIds.includes(id));

  const q = query.trim().toLowerCase();
  const hasMetaFilter = textureFilter || tempFilter || typeFilter;
  const filterByMeta = (ids) => ids.filter(id => {
    const meta = FOOD_META[id];
    if (!meta) return !textureFilter && !tempFilter && !typeFilter;
    if (textureFilter && !meta.textures.includes(textureFilter)) return false;
    if (tempFilter && !meta.temps.includes(tempFilter)) return false;
    if (typeFilter && meta.type !== typeFilter) return false;
    return true;
  });

  const allFoodIds = [...new Set([...KITCHEN.flatMap(c => c.ids), ...CATALOG_CATS.flatMap(c => c.ids)])];
  const matchedFoods = filterByMeta(q ? allFoodIds.filter(id => FOOD_CATALOG[id]?.name.toLowerCase().includes(q)) : allFoodIds);
  const matchedMenus = q ? savedMenus.filter(m => m.name.toLowerCase().includes(q)) : savedMenus;

  const FoodTile = ({ id }) => {
    const on = kitchenFoods.includes(id);
    return (
      <div onClick={() => toggle(id)} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, padding: '10px 4px 8px', borderRadius: 12, background: on ? '#E4F3DC' : '#fff', border: on ? '1.5px solid #A9D18E' : `1px solid ${CARE_COLORS.lineSoft}`, cursor: 'pointer', position: 'relative', transition: 'background .15s, border-color .15s' }}>
        <FoodImage id={id} size={44} />
        <div style={{ fontSize: 11, fontWeight: 600, color: CARE_COLORS.ink, textAlign: 'center', lineHeight: 1.2, fontFamily: careFont }}>{FOOD_CATALOG[id].name}</div>
        {on && <div style={{ position: 'absolute', top: 6, right: 6, width: 16, height: 16, borderRadius: '50%', background: '#6B9E52', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><svg width="8" height="8" viewBox="0 0 8 8" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M1.5 4l1.8 1.8L6.5 2"/></svg></div>}
      </div>
    );
  };

  return (
    <div style={{ position: 'relative', height: '100%', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      <CareStatusBar />
      <div style={{ flex: 1, overflow: 'auto', padding: '12px 20px 24px', fontFamily: careFont }}>
        <div style={{ fontFamily: serifFont, fontSize: 28, fontWeight: 500, letterSpacing: -.4, color: CARE_COLORS.ink, marginBottom: 16 }}>Kitchen</div>

        {/* Search bar */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '11px 14px', background: '#fff', borderRadius: 12, border: `1px solid ${CARE_COLORS.line}`, marginBottom: 12 }}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke={CARE_COLORS.muted} strokeWidth="1.8" strokeLinecap="round"><circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/></svg>
          <input
            value={query}
            onChange={e => setQuery(e.target.value)}
            placeholder="Search foods…"
            style={{ flex: 1, border: 'none', outline: 'none', background: 'transparent', fontFamily: careFont, fontSize: 15, color: CARE_COLORS.ink }}
          />
          {q && (
            <div onClick={() => setQuery('')} style={{ cursor: 'pointer', color: CARE_COLORS.muted, lineHeight: 1 }}>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M2 2l10 10M12 2L2 12"/></svg>
            </div>
          )}
        </div>
        <PillFilterRows textureFilter={textureFilter} setTextureFilter={setTextureFilter} tempFilter={tempFilter} setTempFilter={setTempFilter} typeFilter={typeFilter} setTypeFilter={setTypeFilter} />

        {/* Search results */}
        {(q || hasMetaFilter) ? (
          <>
            {matchedFoods.length === 0 && (
              <div style={{ textAlign: 'center', color: CARE_COLORS.muted, fontSize: 14, marginTop: 40 }}>{q ? `No results for "${query}"` : 'No results found'}</div>
            )}
            {(() => {
              const inKitchen = matchedFoods.filter(id => kitchenFoods.includes(id));
              const notInKitchen = matchedFoods.filter(id => !kitchenFoods.includes(id));
              return (
                <>
                  {inKitchen.length > 0 && (
                    <div style={{ marginBottom: 24 }}>
                      <div style={{ fontSize: 11, fontWeight: 700, color: CARE_COLORS.muted, letterSpacing: .5, textTransform: 'uppercase', marginBottom: 10, fontFamily: careFont }}>In your kitchen</div>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8 }}>
                        {inKitchen.map(id => <FoodTile key={id} id={id} />)}
                      </div>
                    </div>
                  )}
                  {notInKitchen.length > 0 && (
                    <div style={{ marginBottom: 24 }}>
                      <div style={{ fontSize: 11, fontWeight: 700, color: CARE_COLORS.muted, letterSpacing: .5, textTransform: 'uppercase', marginBottom: 6, fontFamily: careFont }}>Not in your kitchen yet</div>
                      <div style={{ fontSize: 12, color: CARE_COLORS.muted, marginBottom: 10, fontFamily: careFont, lineHeight: 1.4 }}>Tap to add to your kitchen — then open the Kitchen sheet to put it on today's menu.</div>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8 }}>
                        {notInKitchen.map(id => <FoodTile key={id} id={id} />)}
                      </div>
                    </div>
                  )}
                </>
              );
            })()}
          </>
        ) : (
          <>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
              <div style={{ fontSize: 13, color: CARE_COLORS.muted, fontFamily: careFont }}>Tap to add or remove from your kitchen</div>
              <div onClick={() => setKitchenFoods([])} style={{ fontSize: 12, color: CARE_COLORS.muted, fontWeight: 600, cursor: 'pointer', textDecoration: 'underline', fontFamily: careFont }}>Clear all</div>
            </div>

            {CATALOG_CATS.map(cat => {
              const isOpen = openStoreCats.has(cat.label);
              const toggleCat = () => setOpenStoreCats(s => { const n = new Set(s); isOpen ? n.delete(cat.label) : n.add(cat.label); return n; });
              const inKitchenCount = cat.ids.filter(id => kitchenFoods.includes(id)).length;
              return (
                <div key={cat.label} style={{ marginBottom: 8, background: '#fff', borderRadius: 14, border: `1px solid ${CARE_COLORS.lineSoft}`, overflow: 'hidden' }}>
                  <div onClick={toggleCat} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '14px 16px', cursor: 'pointer' }}>
                    <div style={{ fontFamily: careFont, fontSize: 14, fontWeight: 700, color: CARE_COLORS.ink }}>{cat.label}</div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                      {inKitchenCount > 0 && <span style={{ fontSize: 11, fontWeight: 700, color: CARE_COLORS.sageDeep, background: CARE_COLORS.sageSoft, padding: '2px 8px', borderRadius: 99, fontFamily: careFont }}>{inKitchenCount} in kitchen</span>}
                      <span style={{ fontSize: 12, color: CARE_COLORS.muted, fontFamily: careFont }}>{cat.ids.length}</span>
                      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke={CARE_COLORS.muted} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ transition: 'transform .2s', transform: isOpen ? 'rotate(0deg)' : 'rotate(-90deg)', flexShrink: 0 }}><path d="M2 4l4 4 4-4"/></svg>
                    </div>
                  </div>
                  {isOpen && (
                    <div style={{ padding: '0 12px 12px', display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8 }}>
                      {filterByMeta(cat.ids).map(id => <FoodTile key={id} id={id} />)}
                    </div>
                  )}
                </div>
              );
            })}

          </>
        )}
      </div>
      <div style={{ padding: '12px 20px 88px', flexShrink: 0, borderTop: `1px solid ${CARE_COLORS.lineSoft}`, background: CARE_COLORS.bg }}>
        <button onClick={() => { onAddToKitchen && onAddToKitchen(kitchenFoods); onAddToMenu && onAddToMenu(newlyAdded); onDone(); }} style={{ width: '100%', border: 'none', padding: '16px', borderRadius: 12, fontFamily: careFont, fontSize: 16, fontWeight: 600, background: CARE_COLORS.sageDeep, color: '#fbf6ea', cursor: 'pointer', boxShadow: '0 4px 14px rgba(40,80,40,.15)' }}>
          {newlyAdded.length > 0 ? `Add · ${newlyAdded.length} ${newlyAdded.length === 1 ? 'item' : 'items'}` : 'Back to menu'}
        </button>
      </div>
    </div>
  );
}

function CareSetup({ onDone }) {
  const [name, setName] = React.useState('');
  const handle = () => {
    const trimmed = name.trim();
    if (!trimmed) return;
    localStorage.setItem('pyp_childName', trimmed);
    onDone(trimmed);
  };
  return (
    <div style={{ position: 'relative', height: '100%', display: 'flex', flexDirection: 'column', background: CARE_COLORS.bg }}>
      <CareStatusBar />
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: '0 28px' }}>
        <div style={{ fontFamily: serifFont, fontSize: 26, fontWeight: 500, color: CARE_COLORS.ink, marginBottom: 32, letterSpacing: -.3, lineHeight: 1.35 }}>Enter a first name for your child:</div>
        <input
          value={name}
          onChange={e => setName(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && handle()}
          placeholder="Child's name…"
          autoFocus
          style={{ fontSize: 20, padding: '14px 16px', borderRadius: 12, border: `1.5px solid ${CARE_COLORS.line}`, outline: 'none', fontFamily: serifFont, color: CARE_COLORS.ink, background: '#fff', marginBottom: 16, width: '100%', boxSizing: 'border-box' }}

function AppleNotifBanner({ childName, pickedPlate, onDismiss, onTap, savedMenus = [] }) {
  const [dismissing, setDismissing] = React.useState(false);

  const items = pickedPlate?.items || [];
  const foodIds = [...new Set(items.map(it => it.id))];
  const historicalFoods = new Set(savedMenus.flatMap(m => m.ids));
  const newFoods = foodIds.filter(id => !historicalFoods.has(id));
  const familiarFoods = foodIds.filter(id => historicalFoods.has(id));
  const nameList = ids => { const ns = ids.map(id => FOOD_CATALOG[id]?.name).filter(Boolean); return ns.length <= 2 ? ns.join(' and ') : ns.slice(0,-1).join(', ') + ' and ' + ns.slice(-1); };

  let headline, subline;
  if (newFoods.length > 0 && familiarFoods.length > 0) {
    headline = `${familiarFoods.length} familiar, ${newFoods.length} new.`;
    subline = `First time with ${nameList(newFoods)}.`;

    headline = `${childName} built their plate.`;
    subline = `${foodIds.length} ${foodIds.length === 1 ? 'food' : 'foods'} chosen.`;

  const dismiss = () => { setDismissing(true); setTimeout(onDismiss, 320); };

              <div style={{ textAlign: 'center', maxWidth: 340, width: '100%' }}>
                <div style={{ fontSize: 32, marginBottom: 12 }}>🍽️</div>
                <div style={{ fontFamily: 'Fraunces, Georgia, serif', fontSize: 28, fontWeight: 500, color: '#2a241c', marginBottom: 8 }}>Enter family code</div>
                <div style={{ fontFamily: 'Nunito, system-ui', fontSize: 15, color: '#8a7c66', marginBottom: 28, lineHeight: 1.5 }}>Ask the parent to open Settings in their app to find the code.</div>
                <input value={codeInput} onChange={e => setCodeInput(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6))} placeholder="ABC123" style={{ width: '100%', padding: '18px', fontSize: 26, textAlign: 'center', fontFamily: 'Nunito, system-ui', fontWeight: 700, letterSpacing: 6, borderRadius: 14, border: '2px solid #d8cfc0', outline: 'none', marginBottom: 14, background: '#fff' }} />
                <button onClick={() => { const c = codeInput.trim(); if (c.length === 6) { localStorage.setItem('pyp_family_code', c); setFamilyCode(c); __getToken().then(token => fetch('/api/join-family', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ code: c }) })).catch(() => {}); } }} disabled={codeInput.length < 6} style={{ width: '100%', padding: '16px', background: codeInput.length === 6 ? '#4a7c59' : '#c0b8a8', color: '#fff', border: 'none', borderRadius: 14, fontFamily: 'Nunito, system-ui', fontSize: 17, fontWeight: 700, cursor: codeInput.length === 6 ? 'pointer' : 'default', transition: 'background .15s' }}>Connect</button>
              </div>
            </div>
          );
          const scale = Math.min(window.innerWidth / 1180, window.innerHeight / 820);
          return (
            <div style={{ position: 'fixed', inset: 0, background: '#f6efe2', display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden' }}>
              <div style={{ transform: `scale(${scale})`, transformOrigin: 'center center' }}>
                <ChildApp key={resetKey} childName={childName} onSubmit={handlePickedPlate} sentMenu={sentMenu} onResetCode={() => { localStorage.removeItem('pyp_family_code'); setFamilyCode(null); }} />
              </div>
            </div>
          );
        }

        return <CaretakerApp childName={childName} pickedPlate={pickedPlate} onSendMenu={handleSendMenu} onNameChange={handleNameChange} onReset={handleReset} onNewMenu={handleNewMenu} standalone />;
      }

      return (
        <div style={{ display: 'flex', alignItems: 'flex-start', gap: 60, flexWrap: 'wrap', justifyContent: 'center' }}>
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 }}>
            <div style={{ fontFamily: 'Inter, system-ui', fontSize: 13, fontWeight: 600, color: 'rgba(60,50,40,.5)', letterSpacing: .5, textTransform: 'uppercase' }}>Caretaker · iPhone</div>
            <CaretakerApp childName={childName} pickedPlate={pickedPlate} onSendMenu={handleSendMenu} onNameChange={handleNameChange} onReset={handleReset} onNewMenu={handleNewMenu} />
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 }}>
            <div style={{ fontFamily: 'Inter, system-ui', fontSize: 13, fontWeight: 600, color: 'rgba(60,50,40,.5)', letterSpacing: .5, textTransform: 'uppercase' }}>Child · iPad</div>
            <ChildApp key={resetKey} childName={childName} onSubmit={handlePickedPlate} sentMenu={sentMenu} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
